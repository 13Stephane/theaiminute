<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Six Moves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{

  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1716; --surface:#172220; --surface-2:#1C2926; --ink:#E4EAE8; --muted:#9DAEA9; --line:#2D3B38;
  --brand:#0D4A52; --brand-ink:#EEF5F4; --brand-2:#86CBD2; --gold:#D6B25E; --gold-soft:#3A3120; --coin:#E0B547; color-scheme:dark;
  --good:#7CC6A2; --good-soft:#1E3329; --bad:#E59383; --bad-soft:#3A2420; --warn:#E0B75C; --warn-soft:#382E17;
  --cto:#7FAEF0; --cfo:#F2A066; --cco:#6CCB8B; --ceo:#F07BA8; --exco:#86CBD2; --on-seat:#0B1513;}}
:root[data-theme="dark"]{
  --bg:#0F1716; --surface:#172220; --surface-2:#1C2926; --ink:#E4EAE8; --muted:#9DAEA9; --line:#2D3B38;
  --brand:#0D4A52; --brand-ink:#EEF5F4; --brand-2:#86CBD2; --gold:#D6B25E; --gold-soft:#3A3120; --coin:#E0B547; color-scheme:dark;
  --good:#7CC6A2; --good-soft:#1E3329; --bad:#E59383; --bad-soft:#3A2420; --warn:#E0B75C; --warn-soft:#382E17;
  --cto:#7FAEF0; --cfo:#F2A066; --cco:#6CCB8B; --ceo:#F07BA8; --exco:#86CBD2; --on-seat:#0B1513;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .4em}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:.3em 0 .6em;max-width:75ch}
a{color:var(--brand-2)} button{font:inherit}
.muted{color:var(--muted)} .small{font-size:.86rem}
#topbar{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:14px;padding:10px max(18px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
#topbar .brand{font-family:var(--serif);font-weight:700;font-size:1.25rem;color:var(--brand-ink);text-decoration:none}
#topbar .cohort{opacity:.8}
#topbar nav{margin-left:auto;display:flex;align-items:center;gap:12px} #topbar .signout{color:var(--brand-ink);opacity:.85} #topbar nav a{color:var(--brand-ink);text-decoration:none;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35)} #topbar nav a.on{background:rgba(255,255,255,.14)}
.pill{font-size:.8rem;padding:3px 10px;border-radius:999px} .pill.warn{background:var(--warn-soft);color:var(--warn)}
#app{max-width:1280px;margin:0 auto;padding:22px 18px 80px}
.empty{max-width:640px;margin:10vh auto;text-align:left}
.primary{background:var(--brand);color:var(--brand-ink);border:0;border-radius:var(--r);padding:11px 18px;font-weight:600;cursor:pointer;min-height:44px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;cursor:pointer;min-height:40px}
.ghost.small{min-height:32px;padding:4px 10px;font-size:.85rem}
.link{background:none;border:0;color:var(--brand-2);text-decoration:underline;cursor:pointer;padding:0}
.link.danger{color:var(--bad)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.home .lead{color:var(--muted)}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:18px}
.teamcard{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.teamcard strong{font-family:var(--serif);font-size:1.2rem}
.case{font-size:.82rem;color:var(--muted)}
/* team */
.team{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.team{grid-template-columns:1fr}}
.rail{position:sticky;top:70px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
@media (max-width:860px){.rail{position:static}}
.railhead h2{margin:0 0 10px}
.gauge{padding:10px 0;border-top:1px solid var(--line)}
.gauge .gl{display:flex;justify-content:space-between;align-items:baseline} .gauge .gl b{font-family:var(--serif);font-size:1.3rem}
.gauge.big .gl span{font-weight:600} .gauge.big .gl b{font-size:2rem;color:var(--brand-2)}
.gs{font-size:.8rem;color:var(--muted)} .hist{font-size:.75rem;color:var(--muted)}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:4px 0} .bar i{height:9px;border-radius:2px;background:var(--line)} .bar i.on{background:var(--brand-2)} .bar.big i{height:14px}
.coins{display:inline-flex;gap:4px;margin:6px 0} .coins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--coin)} .coins i.on{background:var(--coin)}
.score{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:10px} .score b{font-family:var(--serif);font-size:1.6rem} .score small{color:var(--muted)}
.charter{border-top:1px solid var(--line);margin-top:8px;padding-top:8px} .charter summary{cursor:pointer;font-weight:600} .charter p{font-size:.88rem}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--gold-soft);color:var(--warn)}
.people{display:flex;flex-direction:column;gap:2px;font-size:.86rem;border-top:1px solid var(--line);padding-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600} .tabs button:disabled{opacity:.4;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.panel.due{border-color:var(--gold);background:var(--gold-soft)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.notice{padding:14px 16px;border-left:4px solid var(--gold);background:var(--surface);border-radius:4px;margin:12px 0}
.roundhead h1 span{font-family:var(--sans);font-size:1rem;color:var(--muted);font-weight:400;margin-left:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0} .seg button,.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0} .chips button{font-size:.86rem;min-height:36px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:var(--r);padding:12px;cursor:pointer;min-height:64px}
.opt[aria-pressed="true"]{border:2px solid var(--brand-2);background:var(--surface)}
.sentence{font-weight:600;color:var(--brand-2)}
.cardgroup h4{margin:14px 0 6px;font-size:.9rem;padding-left:10px;border-left:4px solid currentColor}
.cardgroup h4.cto{color:var(--cto)} .cardgroup h4.cfo{color:var(--cfo)} .cardgroup h4.cco{color:var(--cco)} .cardgroup h4.ceo{color:var(--ceo)} .cardgroup h4.exco{color:var(--exco)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.gc .gcbtn{all:unset;display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px;cursor:pointer;border-top:6px solid var(--seat);min-height:120px}
.gc.cto{--seat:var(--cto)} .gc.cfo{--seat:var(--cfo)} .gc.cco{--seat:var(--cco)} .gc.ceo{--seat:var(--ceo)} .gc.exco{--seat:var(--exco)}
.gc.on{border:2px solid var(--seat);box-shadow:0 0 0 3px var(--gold-soft)} .gc.off .gcbtn{cursor:not-allowed;opacity:.5}
.gc .gcbtn:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.gtop{display:flex;align-items:flex-start;gap:8px} .gtop .gname{flex:1;min-width:0} .gico{flex:none;width:30px;height:30px;color:var(--seat);margin-top:-2px} .gico svg{width:100%;height:100%;display:block} .gname{font-family:var(--serif);font-weight:700;font-size:1.02rem} .gcost{font-size:.8rem;color:var(--warn);white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:4px} .b{font-style:normal;font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line)} .b.commit{border-color:var(--gold);color:var(--warn)} .b.measure{border-color:var(--cto);color:var(--cto)} .b.tempt{border-color:var(--cfo);color:var(--cfo)}
.gdo{font-size:.84rem} .gidea{font-size:.76rem;font-style:italic;color:var(--brand-2);margin-top:auto} .gcatch{font-size:.8rem;color:var(--muted)} .gcatch b{color:var(--bad);font-weight:600}
.gc .seg{padding:0 10px 8px;margin:0} .gc .seg button{font-size:.82rem;min-height:34px;padding:4px 10px}
.why{font-size:.76rem;color:var(--muted);padding:0 12px 8px}
.problems{margin:10px 0 0;padding-left:18px;color:var(--bad)}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.actions.sticky{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0} .field span{font-weight:600;font-size:.9rem}
.field input,.field textarea,.teamtab input,.teamtab select,.urlbox{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.field.inline{flex-direction:row;align-items:center;gap:10px;margin:0} .field.inline input{width:320px;max-width:60vw}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.routes{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:10px 0}
.routes legend{font-weight:600;padding:0 6px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer} .choice small{display:block;color:var(--muted)} .choice small.test{color:var(--ink);margin-top:4px}
.casebrief{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hq{margin-top:8px}
/* results */
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.rh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px}
.deltas{display:flex;gap:6px;flex-wrap:wrap} .d{font-size:.8rem;padding:3px 9px;border-radius:999px;background:var(--surface-2)} .d.up{background:var(--good-soft);color:var(--good)} .d.down{background:var(--bad-soft);color:var(--bad)}
.moves{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.mv{font-size:.84rem;padding:3px 10px;border-radius:6px;color:var(--on-seat)} .mv.cto{background:var(--cto)} .mv.cfo{background:var(--cfo)} .mv.cco{background:var(--cco)} .mv.ceo{background:var(--ceo)} .mv.exco{background:var(--exco)}
.headlines,.lines,.record{list-style:none;padding:0;margin:8px 0}
.headlines li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)} .hk{font-size:.75rem;color:var(--muted);width:78px;flex:none;padding-top:2px}
.lines li{padding:3px 0 3px 12px;border-left:3px solid var(--line);margin:4px 0} .lines li.good{border-left-color:var(--good)} .lines li.bad{border-left-color:var(--bad)}
.record li{font-size:.84rem;color:var(--muted)}
.gm{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;margin-top:10px}
.reflect{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.verdict{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:20px;margin-bottom:14px} .verdict .muted{color:var(--brand-ink);opacity:.8} .verdict h1{font-size:2.2rem;margin:.1em 0}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px} .charts figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px} .charts figcaption{font-weight:600}
.chart{width:100%;height:auto} .chart .grid{stroke:var(--line);stroke-width:1} .chart .grid.bar4{stroke:var(--gold);stroke-dasharray:4 3} .chart .ax{fill:var(--muted);font-size:10px}
.scoretab{width:100%;max-width:520px;border-collapse:collapse;margin:14px 0} .scoretab td{padding:6px 8px;border-bottom:1px solid var(--line)} .scoretab td:last-child{text-align:right;font-weight:600} .scoretab .lost{color:var(--bad)} .scoretab .earned{color:var(--good)} .scoretab .tot td{font-family:var(--serif);font-size:1.2rem;border-bottom:0}
.moments{padding-left:18px} .hyp{font-family:var(--serif);font-size:1.15rem}
.ver{font-size:.8rem;color:var(--muted);margin-left:8px}
.setup{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.setuprow{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:8px;align-items:center}
.setuprow input,.setuprow select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
@media (max-width:520px){.setuprow{grid-template-columns:1fr 1fr}.setuprow button{grid-column:1/-1;justify-self:start}}
.def{border-left:4px solid var(--gold);background:var(--surface-2);padding:10px 14px;border-radius:4px;font-family:var(--serif);font-size:1.05rem}
.opt b{display:block} .optsub{display:block;font-size:.84rem;color:var(--muted);margin-top:4px}
.yearsel{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin:0 2px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
.copybox{width:100%;min-height:150px;font:.82rem/1.45 var(--sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px}
.rt{border-top:1px solid var(--line);margin-top:6px;padding-top:4px} .rt h4{margin:12px 0 4px;font-size:.95rem} .rt ol{padding-left:20px} .rt li{margin:4px 0}
.spine{padding-left:20px} .spine li{margin:6px 0}
details summary{cursor:pointer;color:var(--brand-2);font-weight:600;margin-top:6px}
.options.k2{grid-template-columns:repeat(2,minmax(0,1fr))} @media (max-width:560px){.options.k2{grid-template-columns:1fr}}
/* console */
.ch{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.drawrow{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)} .drawrow .seg{margin:0} .drawrow .seg button{min-height:34px;padding:4px 10px;font-size:.84rem}
@media (max-width:640px){.drawrow{grid-template-columns:1fr}}
.teamtab{width:100%;border-collapse:collapse} .teamtab th,.teamtab td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:.9rem} .panel{overflow-x:auto}
.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:20px}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.ovh strong{display:block;font-family:var(--serif);font-size:1.15rem}
.ovg div{display:grid;grid-template-columns:78px 1fr 18px;align-items:center;gap:6px;font-size:.8rem} .ovg b{text-align:right}
.ovs{font-size:.86rem}
.flags{display:flex;flex-wrap:wrap;gap:4px} .flags i{font-style:normal;font-size:.74rem;padding:2px 8px;border-radius:999px} .flags .bad{background:var(--bad-soft);color:var(--bad)} .flags .warn{background:var(--warn-soft);color:var(--warn)}
.compare{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
@media (max-width:520px){.compare{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;font-size:.84rem} .legend i{display:inline-block;width:14px;height:4px;margin-right:6px;vertical-align:middle}
.cmp{width:100%;border-collapse:collapse;margin-top:10px;font-size:.84rem} .cmp th,.cmp td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top} .cmp td:first-child{color:var(--muted);white-space:nowrap}
.notes{white-space:normal;line-height:1.6}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(10,20,19,.5)}
dialog dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:12px 0} dialog dt{color:var(--muted);font-size:.86rem} dialog dd{margin:0}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s} .toast.show{opacity:1} .toast.bad{background:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="topbar"><span class="brand">Six Moves</span></header>
<main id="app"></main>
<dialog id="dlg" aria-labelledby="dlg-body"><div id="dlg-body"></div><div class="dlg-actions"><button class="ghost" id="dlg-cancel" onclick="document.getElementById('dlg').close()">Back</button><button class="primary" id="dlg-ok">Confirm</button></div></dialog>

function checkSelection(cs,st,r,sel){

    {label:"Promises kept or released", status: st.broken?"lost":(done?"earned":"open")},

function clone(o){return JSON.parse(JSON.stringify(o))}
async function api(method,path,body){
  let r;
  try{ r=await fetch(API_URL.replace(/\/+$/,"")+path,{method,headers:{"content-type":"application/json","x-code":CODE},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"}) }
  catch(e){ const err=new Error("offline"); err.code="network"; throw err }
  let j=null; try{ j=await r.json() }catch(e){}
  if(!r.ok){ const err=new Error((j&&j.error)||("HTTP "+r.status)); err.status=r.status; err.body=j; err.code=r.status===409?"conflict":r.status===401?"unauthorized":r.status===403?"forbidden":r.status===429?"rate_limited":"server"; throw err }
  return j;
}
function applyState(s){
  role=s.role; canEdit=role==="facilitator"; aiOn=!!s.ai; versions=s.versions||{};
  const js=JSON.stringify([s.settings,s.teams,s.debrief]);
  settings=s.settings||null; teams=s.teams||{}; debrief=s.debrief||null; loadedSettings=true; loadedTeams=true;
  const changed=js!==lastJSON||mode!=="live"||dbError; mode="live"; dbError=null; lastJSON=js;
  if(changed) render();
}
async function pull(){
  try{ applyState(await api("GET","/api/state")) }
  catch(e){ if(e.code==="unauthorized") signOut("That code was not recognised."); else if(e.code==="forbidden"){ dbError="origin"; mode="live"; loadedSettings=true; render() } else if(dbError!=="offline"){ dbError="offline"; render() } }
}
function startPolling(){
  if(polling) return;
  polling=setInterval(()=>{ if(document.visibilityState==="visible"&&mode==="live") pull() },POLL_MS);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&mode==="live") pull() });
}
function signOut(msg){ CODE=""; try{localStorage.removeItem("sixmoves.code")}catch(e){} mode="code"; ui.codeMsg=msg||""; settings=null; teams={}; debrief=null; lastJSON=""; render() }
async function boot(){
  render();
  if(!API_URL){ mode="preview"; canEdit=true; loadedSettings=true; loadedTeams=true; render(); return }
  if(!CODE){ mode="code"; render(); return }
  await pull(); startPolling();
}

// ---------- team view ----------
function teamView(id){
  const meta=teamMeta(id); if(!meta) return '<div class="empty"><p>No team with this link. <a href="#/">Choose your team</a>.</p></div>';
  const cs=CASES[meta.case]; const doc=teamDoc(id); const rep=replay(cs,doc,settings); const st=rep.final;
  const turns=doc.turns||[]; const nextR=turns.length+1;
  const charterLocked=doc.charter&&doc.charter.locked;
  let phase;
  if(!charterLocked) phase="charter";
  else if(st.ended) phase="end";
  else if(nextR>Math.max(settings.openRound||0,2)) phase="waiting";
  else if(nextR===2 && !(settings.draws&&settings.draws[cs.key])) phase="waiting";
  else phase="round";
  if(phase==="end" && ui.tab==="round") ui.tab=settings.bridgeOpen?"bridge":"debrief";
  if(ui.tab==="bridge" && !settings.bridgeOpen) ui.tab="round";
  const tabs=[["round",phase==="end"?"Last round":"This round"],["past","Past rounds"],["debrief","Debrief"]];
  if(settings.bridgeOpen) tabs.push(["bridge","Day 3 bridge"]);
  let main='';
  if(phase==="charter") main=charterView(id,meta,cs,doc);
  else {
    main+='<div class="tabs" role="tablist">'+tabs.map(([k,l])=>'<button role="tab" aria-selected="'+(ui.tab===k)+'" data-action="tab" data-tab="'+k+'"'+(k==="debrief"&&phase!=="end"?' disabled':'')+'>'+l+'</button>').join("")+'</div>';
    if(ui.tab==="past") main+=pastView(cs,doc,rep);
    else if(ui.tab==="debrief"&&phase==="end") main+=debriefView(id,cs,doc,rep);
    else if(ui.tab==="bridge"&&settings.bridgeOpen) main+=bridgeView(id,cs,doc);
    else {
      if(rep.rounds.length) main+=resultView(id,cs,doc,rep,rep.rounds.length-1,true);
      if(phase==="round") main+=roundForm(id,cs,doc,rep,nextR);
      else if(phase==="waiting") main+='<div class="notice">'+(nextR===2&&!(settings.draws&&settings.draws[cs.key])?"Round 2 opens once the facilitators have drawn the hidden answers.":"Round "+nextR+" opens when the facilitators start it. Use the time to discuss the coaching question.")+'</div>';
      else if(phase==="end") main+='<div class="notice">The game is over. Open the debrief tab.</div>';
    }
  }
  return '<div class="team"><aside class="rail">'+railView(meta,cs,doc,rep)+'</aside><section class="main">'+main+'</section></div>';
}

function turnReady(cs,st,r,prev){
  const chk=checkSelection(cs,st,r,ui.sel);
  if(ui.sel.length===0) return {ok:false,msg:"Choose your moves."};
  if(!chk.ok) return {ok:false,msg:chk.reasons[0]};
  if(r>=2&&ui.pm==null) return {ok:false,msg:"Answer the people moment."};
  if(r<3){const p=ui.promise||{}; if(!p.none&&!(p.owner!=null&&p.kind&&p.target!=null)) return {ok:false,msg:"Make a promise, or choose no promise."}}
  return {ok:true,msg:ui.sel.length===1?"You are playing one move this round.":"Ready to review."};
}
function buildTurn(r){

  if(r>=2) t.pm=ui.pm;
  if(r<3) t.promise=ui.promise.none?{none:true}:{owner:ui.promise.owner,kind:ui.promise.kind,target:ui.promise.target};
  if(ui.due) t.due=ui.due;
  return t;
}

const OPP_DEF="An opportunity is value someone will pay for that they cannot get today, delivered at a margin you can keep. It takes one of four forms. A technology on its own is a candidate, not yet an opportunity.";

 {k:"model",l:"A business model",t:"A new way to charge, deliver or share the margin, often with a partner who holds the complement."},

const CTX=["A standard","An infrastructure","A regulation","A new kind of buyer"];
const ESCAPES=[
 {k:"diff",l:"Differentiation",t:"Rivals cannot offer the same thing: a patented molecule, a qualified process."},

const RT_RULES="You red-team a leadership team's charter for a real opportunity, at ELPIS, an executive programme at DTU on leading industrial science. Write in plain British English, short sentences, no jargon, no exclamation marks. Make the strongest case against the charter. Do not soften it, do not praise it, and do not propose a different opportunity. Never invent facts, figures, companies or sources: argue from what the charter says and from general reasoning, and say when a point would need checking. The team describes the opportunity as it would in public.";

async function genRedTeam(id){
  const d=ui.bridgeDraft; if(!d||!aiOn) return;

      const fresh=JSON.parse(JSON.stringify(teamDoc(id)));
      fresh.bridge=Object.assign({},fresh.bridge||{},bridgeFields(d),{savedAt:new Date().toISOString(),redteam:{rival:String(out.rival).slice(0,900),board:String(out.board).slice(0,900),premortem:out.premortem.slice(0,3).map(p=>({reason:String((p&&p.reason)||"").slice(0,300),signal:String((p&&p.signal)||"").slice(0,300)})),at:new Date().toISOString()}});
      await saveTeam(id,fresh);
    } else toast("The game master could not red-team the charter. Try again.",true);
  }catch(e){
    toast(e&&e.code==="rate_limited"?"Too many requests just now. Try again in a few minutes.":e&&e.code==="unavailable"?"The game master is not available. Use the prompt for any AI.":"The game master could not red-team the charter. Try again.",true);
  }

}

function roundContext(cs,doc,rep,idx){
  const R=rep.rounds[idx], t=R.turn, st=rep.states[idx+1], st0=rep.states[idx];
  return {case:cs.name,seat:cs.seatText,pet_project:cs.pet,round:R.r,years:YEARS[R.r],charter:doc.charter,route:(cs.routes[st.route]||{}).label,
    moves:t.cards.map(c=>effName(cs,c)),decided:t.agreed==="ceo"?"the CEO decided":"all agreed",
    headlines:R.headlines.map(h=>h.kind+": "+h.text+" ("+h.note+")"),results:R.lines.map(l=>l.t),
    gauges_before:{Position:st0.P,Technology:st0.T,Trust:st0.R,Tokens:st0.tok},gauges_after:{Position:st.P,Technology:st.T,Trust:st.R,Tokens:st.tok},
    people_moment:t.pm!=null?cs.pm[String(R.r)].options[t.pm].text:null,case_lens_hint:cs.lens[R.r-1],question_hint:cs.questions[R.r-1]};
}
async function genFeedback(id,idx){
  const meta=teamMeta(id); const cs=CASES[meta.case]; const doc=teamDoc(id); const rep=replay(cs,doc,settings);
  ui.genBusy["r"+idx]=true; render();

    if(out&&out.lens&&out.question) fb={story:String(out.story||"").slice(0,700),lens:String(out.lens).slice(0,300),question:String(out.question).slice(0,300),at:new Date().toISOString()};
  }catch(e){}
  if(!fb) fb={story:"",lens:cs.lens[rep.rounds[idx].r-1],question:cs.questions[rep.rounds[idx].r-1],fallback:true,at:new Date().toISOString()};
  const fresh=JSON.parse(JSON.stringify(teamDoc(id))); if(fresh.turns&&fresh.turns[idx]&&!fresh.turns[idx].feedback){fresh.turns[idx].feedback=fb; try{await saveTeam(id,fresh)}catch(e){writeFailed(e)}}
  ui.genBusy["r"+idx]=false; render();
}
async function genDebrief(id){
  const meta=teamMeta(id); const cs=CASES[meta.case]; const doc=teamDoc(id); const rep=replay(cs,doc,settings);
  ui.genBusy.debrief=true; render();
  try{
    const ctx={case:cs.name,charter:doc.charter,rounds:rep.rounds.map((R,i)=>roundContext(cs,doc,rep,i)),promises:(doc.turns||[]).map(t=>t.promise||null),reflections:(doc.turns||[]).map(t=>t.reflection||null),final:{Position:rep.final.P,Technology:rep.final.T,Trust:rep.final.R,Tokens:rep.final.tok},verdict:rep.score.verdict,checks:rep.score.checks};
    const out=(await aiCall("debrief",ctx,id)).json;
    if(out&&Array.isArray(out.moments)&&out.hypothesis){ const fresh=JSON.parse(JSON.stringify(teamDoc(id))); fresh.debrief={moments:out.moments.slice(0,3).map(m=>({round:m.round,text:String(m.text).slice(0,400)})),hypothesis:String(out.hypothesis).slice(0,500),at:new Date().toISOString()}; await saveTeam(id,fresh) }
    else toast("The game master could not write the debrief. Try again.",true);
  }catch(e){ toast(e&&e.code==="rate_limited"?"Too many requests just now. Try again in a few minutes.":"The game master could not write the debrief. Try again.",true) }
  ui.genBusy.debrief=false; render();
}
async function genConsole(){
  ui.genBusy.console=true; render();
  try{
    const data=settings.teams.map(t=>{const cs=CASES[t.case]; const doc=teamDoc(t.id); const rep=replay(cs,doc,settings); return {team:t.name,case:cs.name,route:(cs.routes[rep.final.route]||{}).label,charter:doc.charter,rounds:rep.rounds.map(R=>({years:YEARS[R.r],moves:R.turn.cards.map(c=>effName(cs,c)),decided:R.turn.agreed,people_moment:R.turn.pm!=null?readingOf(cs,R.r,R.turn.pm):null,results:R.lines.map(l=>l.t)})),position_path:rep.states.map(x=>x.P),final:{Position:rep.final.P,Trust:rep.final.R,Tokens:rep.final.tok},verdict:rep.score.verdict,flags:{blind:rep.final.blind,broken:rep.final.broken,noPromise:rep.final.noPromise,capped:rep.final.capped}}});
    const {text}=await aiCall("console",data);
    await saveDebrief({text:String(text).slice(0,4000),at:new Date().toISOString()});
  }catch(e){ toast(e&&e.code==="forbidden"?"You don’t have permission to save notes.":"The game master could not draft the notes. Try again.",true) }
  ui.genBusy.console=false; render();
}
// ---------- events ----------
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.setupName!=null && ui.setupDraft){ ui.setupDraft[+el.dataset.setupName].name=el.value; return }
  if(el.dataset.bdraft!=null){ const d=ui.bridgeDraft; if(!d) return; d[el.dataset.bdraft]=el.value; if(el.tagName==="TEXTAREA"){el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"} const btn=$('[data-action="b-redteam"]'); if(btn&&!ui.genBusy.redteam) btn.disabled=!bridgeReady(d); const hint=$("#b-ready"); if(hint) hint.textContent=bridgeReady(d)?"It reads the charter as it stands on screen.":"Name the opportunity, choose its form, and write lines 1, 2 and 3 first."; const pr=$("#b-prompt"); if(pr) pr.value=rtPromptAnyAI(d); return }
  if(el.dataset.draft){ const d=ui.charterDraft; if(!d) return; if(el.dataset.draft==="player") d.players[+el.dataset.i]=el.value; else if(el.dataset.draft==="route") d.route=el.value; else d[el.dataset.draft]=el.value;
    if(el.tagName==="TEXTAREA"){el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"}
    const btn=$('[data-action="review-charter"]'); const ok=d.l1.trim()&&d.l2.trim()&&d.l3.trim()&&d.route&&d.players.every(p=>p.trim()); if(btn){btn.disabled=!ok} if(el.dataset.draft==="route") render(); }
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset.setupCase!=null && ui.setupDraft){ ui.setupDraft[+el.dataset.setupCase].case=el.value; return }
  if(el.dataset.bdraft!=null && ui.bridgeDraft){ ui.bridgeDraft[el.dataset.bdraft]=el.value; const pr=$("#b-prompt"); if(pr) pr.value=rtPromptAnyAI(ui.bridgeDraft); return }
  if(el.dataset.set==="cohort"){const s=JSON.parse(JSON.stringify(settings)); s.cohort=el.value.trim()||"Six Moves"; try{await saveSettings(s)}catch(x){writeFailed(x)}}
  if(el.dataset.teamName!=null){const s=JSON.parse(JSON.stringify(settings)); s.teams[+el.dataset.teamName].name=el.value.trim()||s.teams[+el.dataset.teamName].name; try{await saveSettings(s)}catch(x){writeFailed(x)}}
  if(el.dataset.teamCase!=null){const s=JSON.parse(JSON.stringify(settings)); s.teams[+el.dataset.teamCase].case=el.value; try{await saveSettings(s)}catch(x){writeFailed(x)}}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-action]"); if(!b||b.disabled) return;
  const a=b.dataset.action; const id=route.id;
  const meta=id&&settings?teamMeta(id):null; const cs=meta?CASES[meta.case]:null;
  switch(a){
    case "sign-out": signOut(""); break;
    case "new-game": openDialog('<h2>Start a new game?</h2><p>Every team, round, bridge and note will be deleted, and new hidden answers will be drawn at setup. This cannot be undone.</p>',async()=>{ if(mode==="live") await api("POST","/api/reset"); settings=null; teams={}; debrief=null; versions={}; lastJSON=""; ui=freshUI(); location.hash="#/"; render() },"Delete and start again"); break;
    case "create-game": { const rows=(ui.setupDraft||[]).map(t=>({name:String(t.name||"").trim(),case:t.case})).filter(t=>t.name); if(!rows.length){toast("Name at least one team.",true); break} const list=rows.map((t,i)=>({id:"team-"+(i+1),name:t.name,case:t.case})); const salt=newSalt(), draws={}; for(const k of Object.keys(CASES)) draws[k]={code:encodeDraw({fav:Math.random()<CASES[k].p,bindBad:Math.random()<0.5},salt)}; try{await saveSettings({cohort:"ELPIS · Leading Industrial Science",openRound:2,bridgeOpen:false,teams:list,draws,salt}); ui.setupDraft=null}catch(x){writeFailed(x)} break; }
    case "setup-add": { const r=ui.setupDraft||[]; if(r.length<6) r.push({name:"Team "+(r.length+1),case:"ptx"}); render(); break; }
    case "setup-remove": { const r=ui.setupDraft||[]; if(r.length>1) r.splice(+b.dataset.i,1); render(); break; }
    case "remove-team": { const tid=b.dataset.id; openDialog('<h2>Remove this team?</h2><p>The team, its charter and any submitted rounds will be deleted. This cannot be undone.</p>',async()=>{const s=JSON.parse(JSON.stringify(settings)); s.teams=s.teams.filter(t=>t.id!==tid); await saveSettings(s); if(teams[tid]) await deleteTeam(tid)},"Remove the team"); break; }
    case "bridge-open": { const s=JSON.parse(JSON.stringify(settings)); s.bridgeOpen=b.dataset.v==="1"; try{await saveSettings(s)}catch(x){writeFailed(x)} break; }
    case "b-set": { const d=ui.bridgeDraft; if(d){ d[b.dataset.k]=b.dataset.v; if(b.dataset.k==="kind"&&b.dataset.v!=="context") d.ctx="" } render(); break; }
    case "b-save": { const d=ui.bridgeDraft; if(!d) break; const fresh=JSON.parse(JSON.stringify(teamDoc(id))); fresh.bridge=Object.assign({},fresh.bridge||{},bridgeFields(d),{savedAt:new Date().toISOString()}); try{await saveTeam(id,fresh); toast("Saved.")}catch(x){writeFailed(x)} break; }
    case "b-redteam": genRedTeam(id); break;
    case "b-copy": { const ta=$("#b-prompt"); try{await navigator.clipboard.writeText(ta.value); toast("Prompt copied.")}catch(x){ ta.focus(); ta.select(); toast("The prompt is selected: copy it with your keyboard.") } break; }
    case "tab": ui.tab=b.dataset.tab; render(); break;
    case "review-charter": {
      const d=ui.charterDraft; const html='<h2>Lock the charter?</h2><p class="muted">Once locked, the charter can only change through an open pivot during play.</p><dl><dt>Team</dt><dd>'+d.players.map((p,i)=>esc(p)+" ("+SEATS[i]+")").join(", ")+'</dd><dt>2032</dt><dd>'+esc(d.l1)+'</dd><dt>Margin</dt><dd>'+esc(d.l2)+' · '+esc(cs.routes[d.route].label)+'</dd><dt>By 2030, or we stop</dt><dd>'+esc(d.l3)+'</dd></dl>';
      openDialog(html,async()=>{const doc=JSON.parse(JSON.stringify(teamDoc(id))); doc.players=d.players.map(p=>p.trim()); doc.charter={l1:d.l1.trim(),l2:d.l2.trim(),l3:d.l3.trim(),route:d.route,locked:true,lockedAt:new Date().toISOString()}; doc.turns=doc.turns||[]; await saveTeam(id,doc); ui.charterDraft=null; render(); window.scrollTo(0,0)},"Lock the charter"); break; }
    case "toggle-card": { const i=ui.sel.findIndex(x=>x.id===b.dataset.id); if(i>=0) ui.sel.splice(i,1); else if(ui.sel.length<2){const c=findCard(cs,b.dataset.id); ui.sel.push({id:c.id,opt:c.options?null:undefined})} render(); break; }
    case "card-opt": { const s=ui.sel.find(x=>x.id===b.dataset.id); if(s){s.opt=b.dataset.opt; if(s.opt!=="pivot") delete s.route} render(); break; }
    case "pivot-route": { const s=ui.sel.find(x=>x.opt==="pivot"); if(s) s.route=b.dataset.route; render(); break; }
    case "pm": ui.pm=+b.dataset.i; render(); break;
    case "agreed": ui.agreed=b.dataset.v; render(); break;
    case "p-owner": ui.promise={owner:+b.dataset.i}; render(); break;
    case "p-none": ui.promise={none:true}; render(); break;
    case "p-kind": ui.promise=Object.assign({},ui.promise,{kind:b.dataset.v,target:null}); render(); break;
    case "p-target": ui.promise.target=ui.promise.kind==="decision"?+b.dataset.v:b.dataset.v; render(); break;
    case "due-decide": ui.due={type:"decided",choice:b.dataset.choice}; render(); break;
    case "due-release": ui.due={type:"release",reason:b.dataset.reason}; render(); break;
    case "review-turn": {
      const doc=teamDoc(id); const rep=replay(cs,doc,settings); const r=(doc.turns||[]).length+1; const turn=buildTurn(r); const prev=(doc.turns||[])[r-2];
      const st=preDue(cs,rep.final,prev,ui.due); const chk=checkSelection(cs,st,r,ui.sel);
      let warn=[];
      if(prev&&prev.promise&&!prev.promise.none){ const pr=prev.promise; const dq=pr.kind==="decision"?cs.decisions[pr.target]:null; const kept=pr.kind==="card"?turn.cards.some(c=>c.id===pr.target):(ui.due&&ui.due.type==="decided"&&!(dq&&dq.kind==="door"&&ui.due.choice===dq.opts[0]&&!turn.cards.some(c=>c.id===dq.card))); if(!kept&&!(ui.due&&ui.due.type==="release")) warn.push("The promise due this round will be recorded as broken: Trust −1.") }
      if(turn.promise&&turn.promise.none) warn.push("No promise this round: Trust −1.");
      if(turn.cards.some(c=>["allin","book","open","bind"].includes(c.opt||c.id)) && r<=2) warn.push("You are committing before the hidden answer is known to everyone.");
      const html='<h2>Submit round '+r+'?</h2><p class="muted">Check it with the whole team. Once submitted, the round cannot be changed.</p><dl><dt>Moves</dt><dd>'+turn.cards.map(c=>esc(effName(cs,c))+(c.route?" → "+esc(cs.routes[c.route].label):"")).join("<br>")+'</dd><dt>Cost</dt><dd>'+chk.cost+' of '+st.tok+' tokens</dd><dt>How you decided</dt><dd>'+(turn.agreed==="ceo"?"The CEO decided":"All agreed")+'</dd>'+(r>=2?'<dt>People moment</dt><dd>'+esc(cs.pm[String(r)].options[turn.pm].text)+'</dd>':'')+(r<3?'<dt>Promise</dt><dd>'+(turn.promise.none?"No promise":esc(playerName(doc,turn.promise.owner))+(turn.promise.kind==="card"?" will get "+esc(nameOf(cs,turn.promise.target))+" played":" will announce: "+esc(cs.decisions[turn.promise.target].q)))+'</dd>':'')+'</dl>'+(warn.length?'<ul class="problems">'+warn.map(w=>'<li>'+esc(w)+'</li>').join("")+'</ul>':'');
      openDialog(html,async()=>{ const fresh=JSON.parse(JSON.stringify(teamDoc(id))); fresh.turns=fresh.turns||[]; if(fresh.turns.length!==r-1) throw {code:"conflict"}; fresh.turns.push(turn); await saveTeam(id,fresh); ui=freshUI(); ui.tab=(r===3||turn.cards.some(c=>c.opt==="stop"))?"debrief":"round"; render(); window.scrollTo(0,0); if(aiOn) setTimeout(()=>genFeedback(id,r-1),50) },"Confirm and submit"); break; }
    case "gen-feedback": genFeedback(id,+b.dataset.idx); break;
    case "rf-last": ui.reflect=Object.assign({},ui.reflect,{last:b.dataset.v}); render(); break;
    case "rf-least": ui.reflect=Object.assign({},ui.reflect,{least:+b.dataset.i}); render(); break;
    case "rf-save": { const idx=+b.dataset.idx; const fresh=JSON.parse(JSON.stringify(teamDoc(id))); if(fresh.turns[idx].reflection) break; fresh.turns[idx].reflection={ceoLast:ui.reflect.last==="y",least:ui.reflect.least}; try{await saveTeam(id,fresh); ui.reflect=null}catch(x){writeFailed(x)} break; }
    case "gen-debrief": genDebrief(id); break;
    case "fit": { const fresh=JSON.parse(JSON.stringify(teamDoc(id))); if(fresh.debrief){fresh.debrief.fit=b.dataset.v; try{await saveTeam(id,fresh)}catch(x){writeFailed(x)}} break; }
    case "open-round": { const s=JSON.parse(JSON.stringify(settings)); s.openRound=+b.dataset.v; try{await saveSettings(s)}catch(x){writeFailed(x)} break; }
    case "reveal-toggle": ui.reveal=!ui.reveal; render(); break;
    case "draw": { const k=b.dataset.case; const cs2=CASES[k]; const doDraw=async()=>{const s=JSON.parse(JSON.stringify(settings)); s.draws=s.draws||{}; s.salt=s.salt||newSalt(); s.draws[k]={code:encodeDraw({fav:Math.random()<cs2.p,bindBad:Math.random()<0.5},s.salt)}; await saveSettings(s); toast(cs2.name+": hidden answer drawn.")};
      if((settings.draws||{})[k]) openDialog('<h2>Draw again for '+esc(cs2.name)+'?</h2><p>Teams on this case would play a different world from the one already drawn.</p>',doDraw,"Draw again"); else { try{await doDraw()}catch(x){writeFailed(x)} } break; }
    case "set-draw": { const k=b.dataset.case; const s=JSON.parse(JSON.stringify(settings)); s.draws=s.draws||{}; s.salt=s.salt||newSalt(); const prev=getDraw(settings,k); const prevBind=prev?prev.bindBad:Math.random()<0.5; s.draws[k]={code:encodeDraw({fav:b.dataset.v==="1",bindBad:prevBind},s.salt)}; try{await saveSettings(s); toast(CASES[k].name+": hidden answer set.")}catch(x){writeFailed(x)} break; }
    case "add-team": { const s=JSON.parse(JSON.stringify(settings)); const n=s.teams.length+1; let tid="team-"+n; while(s.teams.some(t=>t.id===tid)) tid+="x"; s.teams.push({id:tid,name:"Team "+n,case:"ptx"}); try{await saveSettings(s)}catch(x){writeFailed(x)} break; }
    case "copy-link": { const url=location.href.split("#")[0]+"#/team/"+encodeURIComponent(b.dataset.id); try{await navigator.clipboard.writeText(url); toast("Link copied.")}catch(x){ openDialog('<h2>Link for this team</h2><p class="muted">Copy it and open it on the team’s laptop.</p><input class="urlbox" readonly value="'+esc(url)+'">',async()=>{},"Done") } break; }
    case "reset-team": { const tid=b.dataset.id; openDialog('<h2>Reset this team?</h2><p>Its charter and every submitted round will be deleted. This cannot be undone.</p>',async()=>{await deleteTeam(tid)},"Reset the team"); break; }
    case "gen-console": genConsole(); break;
  }
});
boot();
