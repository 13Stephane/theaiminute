<!doctype html>
<html lang="pt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sondagens · a figura viva da maré e do muro</title>

<!--
  Course — Sondagens
  One self-contained file, no build step. Serve the folder and open it.

    #/          the door
    #/triagem   private first pass, one activity at a time, no aggregate visible
    #/eu        personal view, that device only, after the facilitator releases it
    #/figura    the projected figure: terrain, water, gate, and the five controls
    #/sala      facilitator console: the morning's six names, the wall, the phase

  Code is English by convention; everything the room sees is Portuguese.
  Room state lives in window.storage when the artifact runtime provides it, and
  in localStorage otherwise, so a rehearsal on one laptop behaves like a room.
-->

<style>
  :root{ --bg:#193C3F; --ink:#F4F0E9; --gold:#C6A553; --teal:#67A5AB;
         --copp:#BE7B4F; --col:#2C5558; --mut:#9FB4B0; --panel:#14333A;
         --line:#2C5457; --green:#7FA88C; --grey:#5E7679; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:Calibri,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:22px 24px 40px;-webkit-text-size-adjust:100%}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:28px;margin:0 0 4px;font-weight:600}
  h2{font-size:11px;letter-spacing:.14em;color:var(--gold);margin:0 0 10px;text-transform:uppercase}
  .sub{color:var(--mut);font-size:15px;margin-bottom:16px}
  .kicker{font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin-bottom:9px}
  .shell{max-width:1180px;margin:0 auto}
  .narrow{max-width:620px;margin:0 auto}

  /* ---- the figure ---- */
  .wrap{display:flex;gap:22px;align-items:stretch}
  .terrain{flex:1 1 auto;min-width:0}
  .gate{flex:0 0 316px;background:var(--panel);border-radius:10px;padding:15px;
        border:1px solid transparent;transition:border-color .4s, box-shadow .4s}
  .gate.lit{border-color:var(--gold);box-shadow:0 0 26px rgba(198,165,83,.22)}
  .bricks{max-height:352px;overflow:auto}
  .brick{display:flex;gap:9px;align-items:flex-start;margin:7px 0;font-family:Georgia,serif;font-size:13px;line-height:1.3}
  .mark{width:11px;height:11px;flex:0 0 auto;margin-top:3px}
  .filled{background:var(--gold)}
  .hollow{border:1px solid var(--grey)}
  .legend{color:var(--mut);font-size:11px;margin-top:10px;line-height:1.5}
  .count{font-family:Georgia,serif;font-size:19px;margin:12px 0 0}
  .count b{color:var(--gold);font-weight:600}

  /* ---- controls ---- */
  .bar{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  input[type=range]{width:100%;accent-color:var(--teal);margin:0}
  /* the slider is driven by hand while talking to a room, so it takes arrow keys
     and shows where the focus is */
  input[type=range]:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  /* the two marks can sit close together, so they get their own lines */
  .ticks{position:relative;height:30px;margin-top:2px}
  .ticks span{position:absolute;transform:translateX(-50%);color:var(--mut);
              font-size:10px;letter-spacing:.12em;white-space:nowrap}
  .ticks span:before{content:"";position:absolute;left:50%;top:-4px;width:1px;height:4px;background:var(--mut)}
  .ticks .t2{top:15px}
  .ticks .t2:before{top:-19px;height:19px}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}
  button,select,input[type=text],input[type=number]{background:transparent;border:1px solid #3E6467;color:var(--ink);
    padding:8px 13px;border-radius:3px;font-size:12.5px;letter-spacing:.06em;cursor:pointer;
    font-family:inherit}
  button:hover{border-color:var(--gold)}
  button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
  button.ghost{border-color:var(--line);color:var(--mut)}
  button.warn{border-color:#5A3A2A;color:var(--copp)}
  button:disabled{opacity:.4;cursor:not-allowed}
  input[type=text],input[type=number],select,textarea{cursor:text;background:#102b2e}
  input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
  input[type=number]{width:72px;text-align:right;font-variant-numeric:tabular-nums}
  td.n{font-variant-numeric:tabular-nums;color:var(--mut)}
  .overrides{margin-top:10px;font-size:12.5px;color:var(--copp);line-height:1.6}
  .overrides b{color:var(--ink);font-weight:600}

  /* ---- participant ---- */
  .choice{display:block;width:100%;text-align:left;padding:16px 18px;margin:10px 0;border-radius:6px;
          border:1px solid var(--line);background:var(--panel);cursor:pointer}
  .choice:hover{border-color:var(--gold)}
  .choice b{display:block;font-family:Georgia,serif;font-size:19px;margin-bottom:4px;font-weight:600}
  .choice b i{font-style:normal;font-size:13px;color:var(--mut);font-weight:400;margin-left:9px}
  .choice span{color:var(--mut);font-size:13.5px;line-height:1.45}
  .choice span i{display:block;font-style:normal;font-size:11.5px;opacity:.72;margin-top:2px}
  .prompt{font-family:Georgia,serif;font-size:26px;line-height:1.24;margin:6px 0 6px}
  /* roughly 70% of the Portuguese, muted: present for the facilitator and for
     anyone reading past the interpretation, never competing with the question */
  .promptEn{font-family:Georgia,serif;font-size:18px;line-height:1.3;color:var(--mut);margin:0 0 20px}
  .progress{height:2px;background:var(--line);margin:4px 0 22px}
  .progress i{display:block;height:2px;background:var(--gold);transition:width .3s}
  .conf{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  /* the cheapest thing here, and the reason the room recognises its own morning */
  /* block, not flex: the two languages stack instead of racing each other for
     the width of a phone */
  .board{position:relative;padding-left:15px;margin:-12px 0 16px;
         color:var(--gold);font-size:12px;letter-spacing:.09em;line-height:1.4}
  .board:before{content:"";position:absolute;left:0;top:.42em;
                width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .done{font-family:Georgia,serif;font-size:22px;line-height:1.4;padding:70px 0}
  .queued{color:var(--copp);font-size:13px;margin-top:14px}

  /* Column-major grid: six labels get pasted in one pass and six bands in
     another, so the DOM is ordered down the columns and Tab follows it. No
     tabindex, because nothing else is on this screen to fight with. */
  .lunch{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);
         grid-template-columns:58px minmax(0,1fr) 216px;gap:11px 14px;align-items:start;margin:14px 0 4px}
  .lunch .h{color:var(--gold);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding-bottom:2px}
  .lunch .mesa{font-family:Georgia,serif;font-size:16px;color:var(--mut);padding-top:8px}
  .lunch input[type=text],.lunch select{width:100%}
  .warn9{color:var(--copp);font-size:11px;margin-top:4px}
  table.delta td{font-family:Georgia,serif;font-size:14px}
  table.delta .en{color:var(--mut);font-size:11.5px;font-family:inherit;margin-top:2px}
  table.delta .ovr{color:var(--copp);font-size:11.5px;margin-top:4px}
  table.delta tr.gapRow td{opacity:.55}
  .card{background:var(--panel);border-radius:8px;padding:14px 16px;margin:10px 0}
  .card .t{font-family:Georgia,serif;font-size:16px;margin-bottom:6px}
  .card .d{color:var(--mut);font-size:13px;line-height:1.55}
  table{border-collapse:collapse;width:100%;font-size:13px}
  td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--gold);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
  .muted{color:var(--mut)}
  .doors a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;
           padding:18px 20px;margin:12px 0;text-decoration:none;color:var(--ink)}
  .doors a:hover{border-color:var(--gold)}
  .doors b{display:block;font-family:Georgia,serif;font-size:20px;margin-bottom:3px}
  .doors span{color:var(--mut);font-size:13.5px}
  /* the console is the one screen the room never sees, so it leads in English */
  .lockbar{border:1px solid var(--copp);color:var(--copp);border-radius:6px;
           padding:9px 12px;margin-bottom:14px;font-size:13px}
  .pt{color:var(--mut);font-weight:400}
  button .pt{font-size:11px;display:block;margin-top:2px;letter-spacing:.04em}
  .en2{color:var(--mut);font-weight:400}
  button .en2{font-size:10.5px;display:block;margin-top:3px;letter-spacing:.04em;opacity:.85}
  .kicker .en2{margin-left:8px;opacity:.8}
  .legend .en2{display:block;margin-top:2px;opacity:.8}
  .done .en2{display:block;font-size:15px;margin-top:8px}
  .board .en2{display:block;margin-top:2px;opacity:.75;letter-spacing:.06em}
  h1 .en2{display:block;font-size:.62em;margin-top:4px;font-weight:400}
  .stamp{position:fixed;right:14px;bottom:12px;font-size:10px;letter-spacing:.18em;
         color:var(--copp);text-transform:uppercase;pointer-events:none}
  @media (max-width:900px){ .wrap{flex-direction:column} .gate{flex:1 1 auto} body{padding:18px 16px 36px} h1{font-size:23px} }
  .report{max-width:900px;margin:0 auto}
  .report ul{margin:6px 0 0;padding-left:18px;font-family:Georgia,serif;font-size:14px;line-height:1.6}
  @media print{
    .noprint{display:none!important}
    html,body{background:#fff;color:#111}
    body{padding:0}
    h1,h2{color:#111}
    h2{color:#7a6427;border-bottom:1px solid #ddd;padding-bottom:3px}
    .sub,.muted,.legend,table.delta .en{color:#555}
    td,th{border-bottom:1px solid #ddd}
    th{color:#7a6427}
    .count b{color:#111}
    table.delta tr.gapRow td{opacity:1;color:#777}
    .report{max-width:none}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="shell" id="app"></div>
<div class="stamp" id="stamp"></div>

<script>
"use strict";

/* ---------------------------------------------------------------- storage */
/* window.storage exists inside the artifact runtime; localStorage otherwise,
   which is what makes a one-laptop rehearsal behave like a room of tabs. */
const MEM = {};
const S = {
  async get(k, shared){
    try { const r = await window.storage.get(k, shared); return r ? r.value : null; }
    catch(e){ try { return localStorage.getItem((shared?"S::":"L::")+k); } catch(e2){ return MEM[k] ?? null; } }
  },
  async set(k, v, shared){
    try { await window.storage.set(k, v, shared); }
    catch(e){ try { localStorage.setItem((shared?"S::":"L::")+k, v); } catch(e2){ MEM[k]=v; } }
  },
  async del(k, shared){
    try { await window.storage.delete(k, shared); }
    catch(e){ try { localStorage.removeItem((shared?"S::":"L::")+k); } catch(e2){ delete MEM[k]; } }
  },
  async list(prefix, shared){
    try { const l = await window.storage.list(prefix, shared); return (l && l.keys) || []; }
    catch(e){
      try {
        const p = (shared?"S::":"L::")+prefix;
        return Object.keys(localStorage).filter(k => k.indexOf(p)===0).map(k => k.slice(3));
      } catch(e2){ return Object.keys(MEM).filter(k => k.indexOf(prefix)===0); }
    }
  },
};

const K_CFG = "snd:cfg";
const K_RESP = "snd:r:";          /* + participant id */
const K_DID = "snd:did";
const K_KEY = "snd:key";          /* facilitator key, this browser only, never published */
const K_PEND = "snd:pending";

/* The backend address ships in session.json, so switching it on or off is a data
   change and never a code change. With no `api` field the page behaves exactly as
   it did before there was one, and #/contagem stays the way the room is counted. */
let API = null;
let KEY = null;
let NET = { up: null, note: "" };

async function api(path, { method = "GET", body = null, key = false } = {}) {
  if(!API) return null;
  const headers = {};
  if(body) headers["content-type"] = "application/json";
  if(key){
    if(!KEY) return null;
    headers["x-key"] = KEY;
  }
  const r = await fetch(API + path, { method, headers,
    body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  if(!r.ok){
    const e = new Error("api " + r.status); e.status = r.status; throw e;
  }
  return r.json();
}

/* --------------------------------------------------------------- the read */
/* A band is a band. The numbers below only exist so the tide has somewhere to
   stop; they are never shown as percentages. */
const BANDS = {
  already:  { w:0.90, pt:"já inunda" },
  under_3:  { w:0.70, pt:"menos de 3 anos" },
  "3_to_7": { w:0.45, pt:"3 a 7 anos" },
  resists:  { w:0.20, pt:"resiste" },
};
/* The room is Brazilian and the facilitator is not. Every surface a participant
   sees is Portuguese first with English under it; the console, which the room
   never sees, runs the other way. Buttons on participant screens stay Portuguese
   alone: a bilingual button is clutter and nobody needs it. */
const CHOICES = [
  { key:"automate", pt:"Automatizar", en:"Automate", color:"var(--gold)",  hex:"#C6A553",
    d:"a máquina faz, um humano confere o lote",
    de:"the machine does it, a human checks the batch" },
  { key:"augment",  pt:"Aumentar",    en:"Augment",  color:"var(--teal)",  hex:"#67A5AB",
    d:"a máquina redige ou lê primeiro, o julgamento fica no circuito",
    de:"the machine drafts or reads first, judgement stays in the loop" },
  { key:"hold",     pt:"Manter",      en:"Hold",     color:"var(--copp)",  hex:"#BE7B4F",
    d:"candidata ao pôlder: a máquina poderia fazer, e podemos escolher que não faça",
    de:"a polder candidate: the machine could do it and we may choose it does not" },
];
const CONF = [ {k:"sure",pt:"com certeza",en:"certain"},
               {k:"fairly",pt:"bastante seguro",en:"fairly sure"},
               {k:"guess",pt:"no palpite",en:"guessing"} ];
const BAND_W = 0.06;              /* half-width of "na linha", in tide units */

const BUILD = 12;   /* bumped whenever this file changes */
const uid = () => Math.random().toString(36).slice(2,10);
const median = xs => { if(!xs.length) return 0; const s=[...xs].sort((a,b)=>a-b), m=s.length>>1;
                       return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ------------------------------------------------------------------ state */
let CFG = null;        /* the room: activities, wall, morning cards, phase, overrides */
let RESP = [];         /* [{pid, choices:{aid:{c,k}}, done}] */
let DID = null;        /* this device, anonymous, never shown */
let MINE = null;       /* this device's own answers */
let W = 0.5;           /* the tide, 0..1 */
let WMODE = "today";   /* today | three | free */
let OPT = { morning:false, outside:false, arrow:false };
let POLL = null;

/* ------------------------------------------------------------------- boot */
async function boot(){
  DID = await S.get(K_DID, false);
  if(!DID){ DID = uid(); await S.set(K_DID, DID, false); }

  const raw = await S.get(K_CFG, true);
  const pub = await loadSeed();

  /* A phone holding an old copy of this HTML cannot be fixed by anything inside
     the old copy, so the check has to come from outside it: session.json is
     fetched no-store and carries the build it was published with. If it is
     newer than the code running, reload once past the cache. Thirty-three
     phones cannot be asked to clear their browsers at 13:22. */
  if(pub && pub.build > BUILD && sessionStorage.getItem("snd:reloaded") !== String(pub.build)){
    try { sessionStorage.setItem("snd:reloaded", String(pub.build)); } catch(e){}
    location.replace(location.pathname + "?b=" + pub.build + location.hash);
    return;
  }
  if(raw){
    CFG = JSON.parse(raw);
    /* The published file is the list of record. Without this, a phone that opened
       the page before lunch keeps sorting the pre-lunch list out of its own
       storage, and at 12:25 that looks exactly like a publish that did not take.
       It is also why an updated list can show up in Portuguese only: the stored
       copy predates the English labels. */
    if(adoptPublished(CFG, pub)) await S.set(K_CFG, JSON.stringify(CFG), true);
  } else {
    CFG = pub;
    CFG.phase = "setup";
    CFG.overrides = {};
    CFG.rehearsal = false;
  }
  MINE = JSON.parse(await S.get("snd:mine", false) || "{}");
  await pull();

  API = (CFG.api || "").replace(/\/+$/, "") || null;
  /* the key arrives once, in the address, and then lives in this browser only.
     It is stripped from the URL immediately so it never survives a screenshot,
     a shared link, or the projector. */
  const fromUrl = (/[?&]k=([^&#]+)/.exec(location.search) || /[?&]k=([^&#]+)/.exec(location.hash) || [])[1];
  if(fromUrl){
    KEY = decodeURIComponent(fromUrl);
    try { localStorage.setItem(K_KEY, KEY); } catch(e){}
    const cleanSearch = location.search.replace(/[?&]k=[^&#]*/, "").replace(/^&/, "?");
    const cleanHash = location.hash.replace(/[?&]k=[^&#]*/, "");
    history.replaceState(null, "", location.pathname + cleanSearch + cleanHash);
  } else {
    try { KEY = localStorage.getItem(K_KEY); } catch(e){ KEY = null; }
  }

  W = wToday();
  window.addEventListener("hashchange", render);
  window.addEventListener("online", flushMine);
  render();
  POLL = setInterval(tick, 5000);
  if(API) tick();
}

/* Takes the list, the wall and the morning cards from the published file, and
   never the phase, the overrules, the counts or the rehearsal flag: those belong
   to the device holding them. A console with unpublished edits keeps its own. */
function adoptPublished(cur, pub){
  if(!pub || !pub.activities) return false;
  if(cur.dirtyList) return false;
  const key = o => JSON.stringify([o.activities, o.wall, o.morning_cards, o.api || null]);
  if(key(cur) === key(pub)) return false;
  cur.activities = pub.activities;
  cur.wall = pub.wall;
  cur.morning_cards = pub.morning_cards;
  cur.api = pub.api;                  /* turning the backend on is a data change */
  if(pub.published_at) cur.published_at = pub.published_at;
  return true;
}

/* session.json when the folder is served; the copy below when the file is
   opened straight off the disk and fetch is refused. */
async function loadSeed(){
  try {
    const r = await fetch("session.json", {cache:"no-store"});
    if(r.ok) return await r.json();
  } catch(e){}
  return JSON.parse(document.getElementById("fallback").textContent);
}

async function pull(){
  const keys = await S.list(K_RESP, true);
  const out = [];
  for(const k of keys){
    const v = await S.get(k, true);
    if(!v) continue;
    try { out.push(JSON.parse(v)); } catch(e){}
  }
  RESP = out;
}

async function publish(){ await S.set(K_CFG, JSON.stringify(CFG), true); return true; }

/* The phase is the one piece of room state the backend owns, because a phone has
   to learn that the sort closed. Without a backend it stays local, which is why
   the sort is never gated on it there. */
async function setPhase(phase){
  CFG.phase = phase;
  await publish();
  if(!API || !KEY) return true;
  try { await api("/p", { method:"POST", key:true, body:{ session: CFG.session, phase } });
        NET.up = true; NET.note = ""; return true; }
  catch(e){ NET.up = false; NET.note = e.status === 401 ? "a chave não foi aceite" : "a fase não chegou à sala"; return false; }
}

/* Never repaint out from under a hand: not mid-drag on the water, not between a
   choice and its confidence tap. Repaint as soon as the hand is off. */
let DRAGGING = false, DIRTY_VIEW = false;
function safeRender(){
  if(PENDING || DRAGGING){ DIRTY_VIEW = true; return; }
  DIRTY_VIEW = false;
  render();
}

/* One poll for everybody. The phase is public, because a phone must know when
   the sort closed; the room's rows need the key, so a participant never has them.
   Every failure degrades to what this device already knows rather than to a
   blank screen: a venue's wifi is not allowed to end the exercise. */
async function tick(){
  if(PENDING) return;
  let dirty = false;

  const raw = await S.get(K_CFG, true);
  if(raw && raw !== JSON.stringify(CFG)){ CFG = JSON.parse(raw); dirty = true; }

  if(API){
    try {
      const p = await api(`/p?session=${encodeURIComponent(CFG.session||"")}`);
      NET.up = true;
      /* the room's phase wins over this device's copy, and is written down, or the
         next read of local storage would put it straight back */
      if(p && p.phase && p.phase !== CFG.phase){
        CFG.phase = p.phase;
        await S.set(K_CFG, JSON.stringify(CFG), true);
        dirty = true;
      }
    } catch(e){ NET.up = false; }

    if(PENDING_SEND) await flushMine();

    if(KEY){
      try {
        const d = await api(`/r?session=${encodeURIComponent(CFG.session||"")}`, { key:true });
        if(d){
          const before = RESP.length, doneBefore = respondents();
          RESP = d.responses || [];
          if(RESP.length !== before || respondents() !== doneBefore) dirty = true;
          NET.up = true;
        }
      } catch(e){
        if(e.status === 401){
          /* a mistyped key must not stick: leaving it in storage means every reload
             fails the same silent way until somebody clears the browser */
          NET.note = "a chave não foi aceite";
          KEY = null;
          try { localStorage.removeItem(K_KEY); } catch(e2){}
          dirty = true;
        }
        NET.up = false;
      }
    }
  } else {
    const n = RESP.length, d = respondents();
    await pull();
    if(RESP.length !== n || respondents() !== d) dirty = true;
  }

  if(dirty) safeRender();
}

/* ------------------------------------------------------------- derivation */
/* Two ways the room's votes arrive: one device per person, or one sheet of
   counts typed by the facilitator. A typed row wins for that activity, because
   somebody deliberately entered it. Everything downstream sees only shares. */
function shares(aid){
  const t = CFG.tally && CFG.tally[aid];
  const fromRoom = (typeof aggShares === "function") ? aggShares(aid) : null;
  if(fromRoom && !RESP.length && !t) return fromRoom;
  if(t){
    const ta=+t[0]||0, tg=+t[1]||0, th=+t[2]||0, tn=ta+tg+th;
    if(tn) return { automate:ta/tn, augment:tg/tn, hold:th/tn, n:tn };
  }
  let a=0,g=0,h=0,n=0;
  for(const r of RESP){
    const c = r.choices && r.choices[aid];
    if(!c) continue;
    n++;
    if(c.c==="automate") a++; else if(c.c==="augment") g++; else if(c.c==="hold") h++;
  }
  const d = n || 1;
  return { automate:a/d, augment:g/d, hold:h/d, n };
}
function model(){
  const acts = acts_().map(a => {
    const sh = shares(a.id);
    const reach = sh.automate + 0.5*sh.augment;
    const band = (a.outside_read && BANDS[a.outside_read.band]) || null;
    return { ...a, sh, reach, height: 1-reach, polder: sh.hold > 0.5, band,
             overridden: !!(CFG.overrides && CFG.overrides[a.id]) };
  });
  acts.sort((p,q) => (p.sh.n?0:1) - (q.sh.n?0:1) || p.height - q.height || p.id.localeCompare(q.id));
  return acts;
}
function wToday(){
  const answered = model().filter(a => a.sh.n);
  return answered.length ? median(answered.map(a => a.reach)) : 0.5;
}
/* Only activities that actually carry a read. A blank read is a gap the
   facilitator chose, and coercing it to a middle band would let it vote on
   where the tide goes in three years. Under three reads there is no median
   worth drawing, so the mark is not drawn at all and the snap is disabled. */
function readWs(){
  return (CFG.activities||[])
    .map(a => a.outside_read && BANDS[a.outside_read.band])
    .filter(Boolean).map(b => b.w);
}
function wThree(){
  const bs = readWs();
  return bs.length >= 3 ? median(bs) : null;
}
function noReads(){ return (CFG.activities||[]).filter(a => !a.outside_read || !BANDS[a.outside_read.band]); }
/* submerged / at the line / dry, with polders standing dry whatever the tide.
   An activity nobody has answered is none of those: reach 0 would say the machine
   cannot touch it, which is a claim, and what is actually there is an absence. */
function stateOf(a, w){
  if(!a.sh.n) return "none";
  if(a.polder) return "polder";
  if(a.height < w - BAND_W) return "sub";
  if(a.height <= w + BAND_W) return "line";
  return "dry";
}
/* A row with no label is a slot the facilitator has not filled, never a question
   anybody should be asked. It is excluded everywhere the room meets the list. */
function acts_(){ return (CFG.activities||[]).filter(a => (a.label_pt||"").trim()); }

/* The six slots are keyed by table, not by position, so filling table 4 before
   table 1 does not shuffle anybody else's row underneath them. */
function boardSlots(){
  const board = (CFG.activities||[]).filter(a => a.source === "waterline_board");
  const slots = new Array(6).fill(null), rest = [];
  board.forEach(a => {
    const t = +a.table;
    if(t >= 1 && t <= 6 && !slots[t-1]) slots[t-1] = a; else rest.push(a);
  });
  rest.forEach(a => { const k = slots.indexOf(null); if(k >= 0) slots[k] = a; });
  return slots;
}
function lockable(){ return respondents() === 0 && tallyTotal() === 0; }
/* Only ever adds a banner. The button is on the console regardless, so a session
   id without a date, or a laptop on the wrong timezone, costs nothing. */
function isSessionDay(){
  const m = /(\d{4}-\d{2}-\d{2})/.exec(CFG.session || "");
  if(!m) return false;
  const d = new Date();
  const today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  return m[1] === today;
}

function respondents(){ return RESP.filter(r => r.done).length; }
/* With a backend the phase is real and the sort waits for it; without one every
   phone is its own room and waiting would lock the whole room out at 13:22. */
function sharedRoom(){ return !!API && NET.up !== false; }

/* Fixed random order per participant, so the room cannot converge by sequence.
   Seeded from the device id, never Math.random: a phone that drops the page
   mid-sort has to come back to the same order, or that person answers one
   activity twice and another never. */
function hash32(s){
  let h = 2166136261 >>> 0;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function sortOrder(){
  const a = acts_().slice();
  let s = hash32((DID||"") + "::" + (CFG.session||""));
  const rnd = () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
const fromBoard = a => a.source === "waterline_board";
function tallyTotal(){
  const t = CFG.tally || {};
  let mx = 0;
  for(const k in t){ const r = t[k]||[]; mx = Math.max(mx, (+r[0]||0)+(+r[1]||0)+(+r[2]||0)); }
  return mx;
}
/* Say where the figure's numbers came from, every time it is on screen */
function sourceLine(){
  const t = tallyTotal();
  return t ? `${t} na contagem da sala` : `${respondents()} respostas`;
}

/* -------------------------------------------------------------- the figure */
const VW = 1000, VH = 545, M = 34, TOP = 52, BASE = 372;
const SPAN = BASE - TOP;

function figureSVG(personal){
  const acts = model();
  if(!acts.length) return `<svg viewBox="0 0 ${VW} ${VH}" width="100%"></svg>`;
  const n = acts.length, gap = 9;
  const cw = (VW - 2*M - (n-1)*gap) / n;
  const wy = BASE - W*SPAN;
  const w3 = wThree();
  const w3y = w3 == null ? null : BASE - w3*SPAN;
  const dim = OPT.morning ? ' opacity=".16"' : '';
  /* two sets of labels in one gutter would be unreadable, so the afternoon's
     step aside while the morning's twelve cards are up */
  const hide = OPT.morning ? ' style="display:none"' : '';
  let g = "";

  /* frame */
  g += `<g${hide}>`
    +  `<text x="${M}" y="${TOP-22}" fill="#9FB4B0" font-size="11" letter-spacing="2.2">ROCHA FIRME · nenhuma máquina</text>`
    +  `<text x="${VW-M}" y="${TOP-22}" fill="#9FB4B0" font-size="11" letter-spacing="2.2" text-anchor="end">AS SUAS TAREFAS, ORDENADAS →</text></g>`;
  g += `<text transform="translate(16,${TOP+SPAN/2}) rotate(-90)" fill="#6E8A86" font-size="10.5" letter-spacing="2" text-anchor="middle">↑ QUANTO FALTA À MÁQUINA</text>`;

  /* columns */
  let cols = "", labs = "";
  acts.forEach((a,i) => {
    const h = Math.max(2, a.height*SPAN), x = M + i*(cw+gap), y = BASE - h;
    a._x = x; a._y = y; a._w = cw;
    const above = y < wy;
    if(!a.sh.n){
      cols += `<rect x="${x.toFixed(1)}" y="${TOP.toFixed(1)}" width="${cw.toFixed(1)}" height="${(BASE-TOP).toFixed(1)}"
        fill="none" stroke="#5E7679" stroke-width="1.5" stroke-dasharray="4 5"/>`;
      cols += `<text x="${(x+cw/2).toFixed(1)}" y="${(TOP+18).toFixed(1)}" fill="#5E7679" font-size="10"
        text-anchor="middle" font-family="Georgia,serif">sem respostas</text>`;
    } else {
      cols += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cw.toFixed(1)}" height="${h.toFixed(1)}" fill="#2C5558"`
           +  (above ? ` stroke="#F4F0E9" stroke-width="1"` : ``) + `/>`;
    }
    /* Two lines on word boundaries beats one line cut mid-word: a name nobody can
       read makes the divergence discussion impossible. Full text on tap. */
    labs += axisLabel(a.label_pt, a.label_en, x + cw/2, BASE + 12);
  });
  g += `<g${dim}>${cols}</g><g${hide}>${labs}</g>`;

  /* water over the columns, so submerged reads as submerged */
  g += `<rect x="${M-10}" y="${wy.toFixed(1)}" width="${VW-2*M+20}" height="${(BASE-wy).toFixed(1)}" fill="#67A5AB" opacity=".42"/>`;

  /* polders stand dry: repaint the column, then copper dikes over the water */
  let pol = "";
  acts.filter(a=>a.polder).forEach(a => {
    const top = Math.min(a._y, wy) - 7;
    /* repaint in the column colour, not the ground colour: a polder is a column
       the water does not reach, not a hole in the terrain */
    pol += `<rect x="${a._x.toFixed(1)}" y="${a._y.toFixed(1)}" width="${a._w.toFixed(1)}" height="${(BASE-a._y).toFixed(1)}" fill="#2C5558"/>`;
    pol += `<rect x="${a._x.toFixed(1)}" y="${(a._y-4).toFixed(1)}" width="${a._w.toFixed(1)}" height="3" fill="#BE7B4F"/>`;
    [a._x-3.5, a._x+a._w+0.5].forEach(dx => {
      pol += `<rect x="${dx.toFixed(1)}" y="${top.toFixed(1)}" width="3" height="${(BASE-top).toFixed(1)}" fill="#BE7B4F"/>`;
    });
  });
  g += `<g${dim}>${pol}</g>`;

  /* the tide, and where it is headed */
  if(w3y != null){
    g += `<line x1="${M-10}" x2="${VW-M+10}" y1="${w3y.toFixed(1)}" y2="${w3y.toFixed(1)}" stroke="#67A5AB" stroke-width="1.5" stroke-dasharray="7 6" opacity=".75"/>`;
    /* left, under its own line: the right edge is where the polders stand */
      g += `<text x="${M+10}" y="${(w3y+13).toFixed(1)}" fill="#67A5AB" font-size="10" letter-spacing="1.6" opacity=".85">PARA ONDE A MARÉ VAI</text>`;
  }
  g += `<line x1="${M-10}" x2="${VW-M+10}" y1="${wy.toFixed(1)}" y2="${wy.toFixed(1)}" stroke="#67A5AB" stroke-width="2.5"/>`;
  const wlab = WMODE==="today" ? "LINHA D'ÁGUA · HOJE" : WMODE==="three" ? "LINHA D'ÁGUA · TRÊS ANOS" : "LINHA D'ÁGUA · E SE?";
  g += `<text x="${M+10}" y="${(wy-7).toFixed(1)}" fill="#F4F0E9" font-size="10.5" letter-spacing="1.8">${wlab}</text>`;
  g += `<text x="${M+10}" y="${BASE-8}" fill="#0F2A2C" font-size="11" letter-spacing="2.2" opacity=".7">SUBMERSO</text>`;

  /* the outside read, one marker per column: the divergence becomes per-column */
  if(OPT.outside){
    let mk = "";
    acts.forEach(a => {
      if(!a.band) return;
      const my = BASE - (1-a.band.w)*SPAN;
      mk += `<line x1="${(a._x-2).toFixed(1)}" x2="${(a._x+a._w+2).toFixed(1)}" y1="${my.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#C6A553" stroke-width="2.5" stroke-dasharray="4 3"/>`;
      if(Math.abs(my - a._y) > 10){
        mk += `<line x1="${(a._x+a._w/2).toFixed(1)}" x2="${(a._x+a._w/2).toFixed(1)}" y1="${Math.min(my,a._y).toFixed(1)}" y2="${Math.max(my,a._y).toFixed(1)}" stroke="#C6A553" stroke-width="1" stroke-dasharray="2 3" opacity=".55"/>`;
      }
    });
    g += `<g${dim}>${mk}</g>`;
    g += `<text x="${VW-M}" y="${TOP-4}" fill="#C6A553" font-size="10" letter-spacing="1.6" text-anchor="end">— — LEITURA EXTERNA · uma leitura, não um veredito</text>`;
  }

  /* the room overrules the read */
  let ovr = "";
  acts.filter(a=>a.overridden).forEach(a => {
    const cx = a._x + a._w/2;
    ovr += `<polygon points="${cx.toFixed(1)},${(a._y-14).toFixed(1)} ${(cx-5).toFixed(1)},${(a._y-6).toFixed(1)} ${(cx+5).toFixed(1)},${(a._y-6).toFixed(1)}" fill="#BE7B4F"/>`;
    ovr += `<rect x="${(a._x-1.5).toFixed(1)}" y="${(a._y-1.5).toFixed(1)}" width="${(a._w+3).toFixed(1)}" height="${(BASE-a._y+1.5).toFixed(1)}" fill="none" stroke="#BE7B4F" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  });
  g += `<g${dim}>${ovr}</g>`;

  /* personal marks, on that device only */
  if(personal && personal.choices){
    let pm = "";
    acts.forEach(a => {
      const c = personal.choices[a.id];
      if(!c) return;
      const spec = CHOICES.find(x=>x.key===c.c);
      pm += `<circle cx="${(a._x+a._w/2).toFixed(1)}" cy="${(a._y-13).toFixed(1)}" r="4.5" fill="${spec?spec.hex:"#F4F0E9"}"/>`;
    });
    g += pm;
  }

  /* the twelve morning cards, in grey, on the same figure */
  if(OPT.morning){
    const cards = [...(CFG.morning_cards||[])]
      .map(c => ({...c, reach: (c.table_votes ? c.machine_votes/c.table_votes : 0)}))
      .sort((p,q) => q.reach - p.reach);
    const m = cards.length || 1, ggap = 11, gcw = (VW - 2*M - (m-1)*ggap)/m;
    let gh = "";
    cards.forEach((c,i) => {
      const h = Math.max(2, (1-c.reach)*SPAN), x = M + i*(gcw+ggap), y = BASE - h;
      gh += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${gcw.toFixed(1)}" height="${h.toFixed(1)}" fill="none" stroke="#5E7679" stroke-width="1.5" stroke-dasharray="5 4"/>`;
      gh += axisLabel(c.label, null, x + gcw/2, BASE + 12, true);
    });
    g += gh;
    g += `<text x="${M}" y="${TOP-38}" fill="#9FB4B0" font-size="11.5" letter-spacing="1.6">OS DOZE CARTÕES DA MANHÃ · o que separaram antes de terem as suas próprias atividades diante de vocês</text>`;
  }

  /* the crossing, on the facilitator's press and not before */
  if(OPT.arrow && !OPT.morning){
    const subs = acts.filter(a => stateOf(a, W)==="sub");
    const tall = subs.length ? subs.reduce((m,a)=> a.height>m.height ? a : m, subs[0]) : null;
    if(tall){
      const x0 = tall._x + tall._w/2, y0 = tall._y - 6;
      const x1 = VW - 12, y1 = 132;
      g += `<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="#C6A553"/></marker></defs>`;
      g += `<path d="M ${x0.toFixed(1)},${y0.toFixed(1)} C ${(x0+90).toFixed(1)},${(y0-90).toFixed(1)} ${(x1-160).toFixed(1)},${(y1-20).toFixed(1)} ${x1},${y1}" fill="none" stroke="#C6A553" stroke-width="2.5" marker-end="url(#ah)"/>`;
      g += `<text x="${x0.toFixed(1)}" y="${(y0-16).toFixed(1)}" fill="#C6A553" font-size="14" font-family="Georgia,serif" text-anchor="middle">o custo cai aqui</text>`;
      g += `<text x="${(x1-14).toFixed(1)}" y="${(y1-14).toFixed(1)}" fill="#C6A553" font-size="14" font-family="Georgia,serif" text-anchor="end">o preço decide-se ali</text>`;
    }
  }

  return `<svg viewBox="0 0 ${VW} ${VH}" width="100%" role="img" aria-label="A figura da maré e do muro">${g}</svg>`;
}

/* Cut on a word boundary, never mid-word, and carry the whole name on tap. Two
   lines were tried and rejected: the viewBox is fixed, so the crowding between
   neighbouring labels is the same on a laptop and on a 1920 projector, and the
   second lines interleave. The figure gives the shape; the divergence table
   carries the full names, which is where that discussion actually happens. */
function axisLabel(text, en, cx, y, dim){
  const MAX = 26, s = String(text||"");
  let out = s;
  if(s.length > MAX){
    const cut = s.slice(0, MAX);
    const sp = cut.lastIndexOf(" ");
    out = (sp > 10 ? cut.slice(0, sp) : cut) + "…";
  }
  return `<text transform="translate(${cx.toFixed(1)},${y}) rotate(-58)"
      fill="${dim ? "#5E7679" : "#9FB4B0"}" font-size="11.5" text-anchor="end"
      font-family="Georgia,serif">${esc(out)}<title>${esc(s)}${en?` · ${esc(en)}`:``}</title></text>`;
}

function countLine(){
  const acts = model();
  const c = { sub:0, line:0, dry:0, polder:0, none:0 };
  acts.forEach(a => c[stateOf(a, W)]++);
  const n = acts.length - c.none;
  const gap = c.none ? ` · <b style="color:var(--copp)">${c.none}</b> sem respostas` : ``;
  const gapEn = c.none ? ` · ${c.none} unanswered` : ``;
  return `submersas: <b>${c.sub}</b> de ${n} · na linha: <b>${c.line}</b> · pôlder: <b>${c.polder}</b> · secas: <b>${c.dry}</b>${gap}`
       + `<span class="en2" style="display:block;font-size:12.5px;margin-top:3px">under water ${c.sub} of ${n} · at the line ${c.line} · polder ${c.polder} · dry ${c.dry}${gapEn}</span>`;
}

function gateHTML(){
  const wall = CFG.wall || [];
  const rows = wall.length
    ? wall.map(b => `<div class="brick"><span class="mark ${b.bound?"filled":"hollow"}"></span>
        <span>${esc(b.label)}${b.label_en?`<div style="color:var(--mut);font-size:11px;margin-top:2px">${esc(b.label_en)}</div>`:``}</span></div>`).join("")
    : `<div class="muted" style="font-size:13px">O muro entra no console da sala, no intervalo.</div>`;
  return `<div class="gate${OPT.arrow?" lit":""}">
    <h2>O muro <span class="pt">the wall</span></h2>
    <div class="bricks">${rows}</div>
    <div class="legend">preenchido: ligado a nós · vazio: genérico ou alugado
      <span class="en2">filled: bound to us · hollow: generic or rented</span></div>
  </div>`;
}

/* ------------------------------------------------------------------ views */
function view(){
  const h = (location.hash || "#/").replace(/^#\/?/, "");
  return h.split("?")[0] || "door";
}
function go(v){ location.hash = "#/" + v; }

function render(){
  const app = document.getElementById("app");
  document.getElementById("stamp").textContent = CFG && CFG.rehearsal ? "ensaio" : "";
  const v = view();
  if(v === "triagem")      app.innerHTML = viewTriagem();
  else if(v === "eu")      app.innerHTML = viewEu();
  else if(v === "figura")  app.innerHTML = viewFigura();
  else if(v === "sala")    app.innerHTML = viewSala();
  else if(v === "contagem") app.innerHTML = viewContagem();
  else if(v === "almoco")   app.innerHTML = viewAlmoco();
  else if(v === "delta")    app.innerHTML = viewDelta();
  else if(v === "relatorio") app.innerHTML = viewRelatorio();
  else                     app.innerHTML = viewDoor();
  wire(v);
}

/* ---- the door ---- */
/* The door offers the sort and nothing else. Two of the other entrances are the
   facilitator's: one shows the aggregate, which is the one thing a participant

   address, so the facilitator can find them without the room being offered them. */
const FACIL = /(^|[?&])f(=|&|$)/.test(location.search);

/* ---- 1 · the private pass ---- */
function viewTriagem(){
  const acts = acts_();
  if(CFG.phase === "setup" && sharedRoom())
    return `<div class="narrow"><div class="kicker">Course · Sondagens</div>
      <h1>Ainda não<span class="en2">Not yet</span></h1>
      <div class="sub">A triagem abre às 13:25. Deixe esta página aberta.
      <span class="en2">The sort opens at 13:25. Leave this page open.</span></div></div>`;

  const order = sortOrder();
  const answered = order.filter(a => MINE[a.id]).length;
  const next = order.find(a => !MINE[a.id]);

  if(!next){
    const released = CFG.phase === "revelado";
    return `<div class="narrow"><div class="kicker">Course · Sondagens</div>
      ${PENDING_SEND ? `<div class="queued">Guardado neste aparelho. Será enviado assim que houver ligação.
        <span class="en2">Saved on this device. It will be sent as soon as there is a connection.</span></div>` : ``}
      <div class="done">Guardado. Só isso.<span class="en2">Saved. That is all.</span>
      <span class="muted" style="font-size:16px;display:block;margin-top:14px">
      ${released ? "A sua leitura está pronta." : "Vai rever isto depois, no seu aparelho."}
      <span class="en2" style="display:block">${released ? "Your reading is ready." : "You will see this again later, on your own device."}</span></span></div>
      ${released ? `<button id="toEu">${bp("a minha leitura","my reading")}</button>` : ``}</div>`;
  }

  /* the progress is the words and nothing else, and there is no way back:
     an answer is committed at the confidence tap and stays committed */
  return `<div class="narrow">
    <div class="kicker">${answered+1} de ${acts.length}<span class="en2">${answered+1} of ${acts.length}</span></div>
    <div class="prompt">${esc(next.label_pt)}</div>
    ${next.label_en ? `<div class="promptEn">${esc(next.label_en)}</div>` : ``}
    ${fromBoard(next) ? `<div class="board">do quadro desta manhã<span class="en2">from this morning's board</span></div>` : ``}
    ${CHOICES.map(c => `<button class="choice" data-c="${c.key}">
        <b style="color:${c.color}">${c.pt}<i>${c.en}</i></b>
        <span>${c.d}<i>${c.de}</i></span></button>`).join("")}
    <div class="legend" style="margin-top:18px">Nada aqui mostra o que a sala respondeu. É de propósito.
      <span class="en2">Nothing here shows what the room answered. That is deliberate.</span></div>
  </div>`;
}

function viewConf(aid){
  const a = (CFG.activities||[]).find(x=>x.id===aid);
  return `<div class="narrow">
    <div class="kicker">opcional<span class="en2">optional</span></div>

/* Bands are ordered so a divergence can be counted in steps rather than asserted.
   The room's own position has to be expressed as a band too, or a share is being
   compared to a band and false precision walks in through the back door. The
   mapping is a presentation choice, so it is stated in the legend, not hidden. */
const BAND_ORDER = ["resists", "3_to_7", "under_3", "already"];
function roomBand(a){
  const r = a.reach;
  return r >= 0.80 ? "already" : r >= 0.60 ? "under_3" : r >= 0.35 ? "3_to_7" : "resists";
}
/* What is actually on the server right now, read back rather than assumed. The
   published file is what the phones load; the console's own copy is not. */
let LIVE = null;
async function checkPublished(){
  try {
    const r = await fetch("session.json?t=" + Date.now(), { cache:"no-store" });
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    LIVE = { build: d.build != null ? d.build : null,
             at: d.published_at || null,
             n: (d.activities||[]).filter(a => (a.label_pt||"").trim()).length,
             board: (d.activities||[]).filter(a => a.source === "waterline_board").length };
  } catch(e){ LIVE = { error:true }; }
}
function hhmm(iso){
  if(!iso) return null;
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
/* What the room is joined to, said plainly, because "the counter says nought" has
   three very different causes and the facilitator needs to know which. */
function backendLine(){
  if(!API) return `no shared room · counts are typed at
    <a href="#/contagem" style="color:var(--mut)">entrada de contagens</a>
    <span class="pt">sem sala partilhada</span>`;
  if(!KEY) return `<span style="color:var(--copp)">shared room configured, but this browser has no key ·
    open #/sala?k=… once <span class="pt">falta a chave</span></span>`;
  if(NET.up === false) return `<span style="color:var(--copp)">shared room not answering${NET.note?` · ${esc(NET.note)}`:``} ·
    fall back to <a href="#/contagem" style="color:var(--copp)">contagens</a></span>`;
  return `shared room live · answers arrive on their own
    <span class="pt">sala partilhada ligada</span>`;
}

function publishedLine(){
  if(!LIVE) return `<span class="muted">a verificar a lista publicada…</span>`;
  if(LIVE.error) return `<span style="color:var(--copp)">não deu para ler a lista publicada</span>`;
  const t = hhmm(LIVE.at);
  const stale = CFG.published_at && LIVE.at !== CFG.published_at;
  return `<span style="color:${stale ? "var(--copp)" : "var(--mut)"}">
    a lista publicada tem <b>${LIVE.n}</b> atividades, <b>${LIVE.board}</b> do quadro${t ? `, de ${t}` : `, sem carimbo`}
    ${stale ? ` · esta consola tem alterações que ainda não foram publicadas` : ``}</span>`;
}

function bandStep(a){
  if(!a.outside_read || !BANDS[a.outside_read.band]) return null;
  return BAND_ORDER.indexOf(roomBand(a)) - BAND_ORDER.indexOf(a.outside_read.band);
}
/* Both signs, in words. An arrow gets read as good and bad. */
function stepWord(d){
  if(d === 0) return `<span class="muted">de acordo</span>`;
  const n = Math.abs(d);
  return d > 0
    ? `<b style="color:var(--gold)">${n} · mais otimista</b>`
    : `<b style="color:var(--copp)">${n} · mais cética</b>`;
}

function deltaRows(){
  const rows = model().map(a => ({ a, step: bandStep(a) }));
  /* a read the facilitator never attached is shown as a row and greyed, because a
     silently missing row is indistinguishable from agreement */
  rows.sort((p, q) => {
    if(p.step === null && q.step === null) return 0;
    if(p.step === null) return 1;
    if(q.step === null) return -1;
    return Math.abs(q.step) - Math.abs(p.step);
  });
  return rows;
}

function deltaTable(){
  const rows = deltaRows();
  if(!rows.length) return `<div class="muted">Sem atividades.</div>`;
  return `<table class="delta"><thead><tr>

}

/* ----------------------------------------------------------------- wiring */
function on(id, ev, fn){ const el = document.getElementById(id); if(el) el.addEventListener(ev, fn); }
function each(sel, ev, fn){ document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, e => fn(el, e))); }

let PENDING = null;   /* activity awaiting its optional confidence tap */

function wire(v){
  if(v === "triagem"){
    each(".choice","click", async el => {
      const next = sortOrder().find(a => !MINE[a.id]);
      if(!next) return;
      PENDING = { id: next.id, c: el.dataset.c };
      document.getElementById("app").innerHTML = viewConf(next.id);
      each("[data-k]","click", async b => {
        if(b.dataset.k === "cancel"){ PENDING = null; render(); return; }
        MINE[PENDING.id] = { c: PENDING.c, k: b.dataset.k==="skip" ? null : b.dataset.k, ts: new Date().toISOString() };
        PENDING = null;
        await saveMine();
        render();
      });
    });
    on("toEu","click", () => go("eu"));
  }

  if(v === "figura"){
    on("toSala","click", () => go("sala"));
    on("w","pointerdown", () => { DRAGGING = true; });
    on("w","input", e => { DRAGGING = true; W = e.target.value/100; WMODE = "free"; repaint(); });
    on("w","change", () => { DRAGGING = false; if(DIRTY_VIEW) safeRender(); });
    on("w","pointerup", () => { DRAGGING = false; if(DIRTY_VIEW) safeRender(); });
    on("snapToday","click", () => { W = wToday(); WMODE="today"; render(); });
    on("snapThree","click", () => { const w = wThree(); if(w == null) return; W = w; WMODE="three"; render(); });
    on("bMorning","click", () => { OPT.morning = !OPT.morning; render(); });
    on("bRead","click",    () => { OPT.outside = !OPT.outside; render(); });
    on("bArrow","click",   () => { OPT.arrow   = !OPT.arrow;   render(); });
    on("ovDo","click", async () => {
      const aid = document.getElementById("ovAct").value;
      const why = document.getElementById("ovWhy").value.trim();
      if(!aid || !why) return;
      CFG.overrides = CFG.overrides || {};
      CFG.overrides[aid] = { why, ts: new Date().toISOString() };
      await publish(); render();
    });
  }

  if(v === "relatorio"){
    on("rPrint","click", () => window.print());
    on("rBack","click", () => go("sala"));
  }

  if(v === "delta"){
    on("dFig","click", () => go("figura"));
    on("dRep","click", () => go("relatorio"));
  }

  if(v === "almoco"){
    /* Never re-render on a keystroke: six labels are pasted in one pass and a
       rebuild would throw the focus and the tab chain away every time. */
    each(".bl","change", async el => {
      const i = +el.dataset.i, val = el.value.trim();
      CFG.dirtyList = true;
      const a = boardSlots()[i];
      if(!a && val){
        CFG.activities = CFG.activities || [];
        CFG.activities.push({ id:"w"+uid(), label_pt:val, source:"waterline_board",
                              table:i+1, outside_read:null });
      } else if(a && !val){
        CFG.activities = CFG.activities.filter(x => x.id !== a.id);
      } else if(a){
        a.label_pt = val;
        if(!a.table) a.table = i+1;
      } else return;

      const now = boardSlots();
      const sel = document.querySelector(`.bb[data-i="${i}"]`);
      if(sel) sel.disabled = !now[i] || !!CFG.locked;
      const w9 = document.getElementById("w9-" + i);
      if(w9) w9.textContent = wordNote(val);
      const c = document.getElementById("lcount");
      if(c) c.textContent = now.filter(s => s && (s.label_pt||"").trim()).length;

      const ok = await publish();
      const m = document.getElementById("aMsg");
      if(m) m.textContent = ok ? "" : ((typeof DBNOTE !== "undefined" && DBNOTE) || "não guardou");
    });

    each(".bb","change", async el => {
      const a = boardSlots()[+el.dataset.i];
      if(!a) return;
      CFG.dirtyList = true;
      /* a blank band is a gap the facilitator chose, and is stored as one */
      a.outside_read = el.value
        ? Object.assign({ drivers:[], falsifier:"" }, a.outside_read || {}, { band: el.value })
        : null;
      const ok = await publish();
      const m = document.getElementById("aMsg");
      if(m) m.textContent = ok ? "" : ((typeof DBNOTE !== "undefined" && DBNOTE) || "não guardou");
    });

    on("lock","click", async () => {
      const n = acts_().length;
      if(!confirm(`Trancar ${n} atividades. Depois disto não se acrescenta nenhuma.`)) return;
      CFG.locked = true; await publish(); render();
    });
    on("unlock","click", async () => {
      if(!lockable()) return;
      CFG.locked = false; await publish(); render();
    });
    on("aExport","click", async () => {
      const now = new Date();
      CFG.published_at = now.toISOString();
      CFG.dirtyList = false;
      await publish();
      const pub = { session: CFG.session, title: CFG.title, subtitle: CFG.subtitle,
                    build: BUILD, published_at: CFG.published_at,
                    activities: CFG.activities, wall: CFG.wall, morning_cards: CFG.morning_cards };
      const text = JSON.stringify(pub, null, 1);
      const out = document.getElementById("aOut"), box = document.getElementById("aJson");
      box.value = text; out.hidden = false; box.focus(); box.select();
      const m = document.getElementById("aMsg");
      try { await navigator.clipboard.writeText(text); if(m) m.textContent = "copiado"; }
      catch(e){ if(m) m.textContent = "selecionado · copie com ⌘C"; }
    });
    on("aBack","click", () => go("sala"));
  }

  if(v === "contagem"){
    each(".tl","change", async el => {
      const id = el.dataset.id, i = +el.dataset.i;
      const v = Math.max(0, Math.floor(+el.value || 0));
      el.value = v;
      CFG.tally = CFG.tally || {};
      CFG.tally[id] = CFG.tally[id] || [0,0,0];
      CFG.tally[id][i] = v;
      const r = CFG.tally[id];
      /* with the room size known, aumentar is what is left over, so the count is
         two shows of hands per line instead of three */
      if(CFG.roomN && (i === 0 || i === 2)){
        r[1] = Math.max(0, (+CFG.roomN||0) - (+r[0]||0) - (+r[2]||0));
        const mid = document.querySelector(`.tl[data-id="${id}"][data-i="1"]`);
        if(mid) mid.value = r[1];
      }
      const tot = document.getElementById("tot-" + id);
      if(tot) tot.textContent = (+r[0]||0) + (+r[1]||0) + (+r[2]||0);
      const ok = await publish();
      const m = document.getElementById("cMsg");
      if(m) m.textContent = ok ? "" : (typeof DBNOTE !== "undefined" && DBNOTE) || "não guardou";
    });
    on("roomN","change", async e => {
      CFG.roomN = Math.max(0, Math.floor(+e.target.value || 0)) || null;
      await publish(); render();
    });
    on("cFig","click", () => go("figura"));
    on("cBack","click", () => go("sala"));
    on("cClear","click", async () => {
      if(!confirm("Limpar todas as contagens? A figura volta a usar os aparelhos.")) return;
      delete CFG.tally; await publish(); render();
    });
  }

  if(v === "sala"){
    if(!LIVE) checkPublished().then(() => { if(view() === "sala") render(); });
    on("pOpen","click",    async () => { await setPhase("triagem"); render(); });
    on("pClose","click",   async () => { await setPhase("figura"); W=wToday(); WMODE="today"; render(); });
    on("pRelease","click", async () => { await setPhase("revelado"); render(); });
    on("toFig","click", () => go("figura"));
    on("toCount","click", () => go("contagem"));
    on("toLunch","click", () => go("almoco"));
    on("toDelta","click", () => go("delta"));
    on("toRep","click", () => go("relatorio"));
    on("sLock","click", async () => {
      const n = acts_().length;
      if(!confirm(`Trancar ${n} atividades. Depois disto não se acrescenta nenhuma.`)) return;
      CFG.locked = true; await publish(); render();
    });
    on("sUnlock","click", async () => { if(lockable()){ CFG.locked = false; await publish(); render(); } });

    each(".six","change", async el => {
      const a = CFG.activities.find(x=>x.id===el.dataset.id);
      if(a){ a.label_pt = el.value; a.source = "waterline_board"; CFG.dirtyList = true; await publish(); }
    });
    each(".band","change", async el => {
      const a = CFG.activities.find(x=>x.id===el.dataset.id);
      if(!a) return;
      CFG.dirtyList = true;
      a.outside_read = el.value
        ? Object.assign({drivers:[],falsifier:""}, a.outside_read||{}, {band: el.value})
        : null;
      await publish();
    });
    each(".wl","change", async el => { const b=CFG.wall.find(x=>x.id===el.dataset.id); if(b){ b.label=el.value; CFG.dirtyList=true; await publish(); } });
    each(".wt","change", async el => { const b=CFG.wall.find(x=>x.id===el.dataset.id); if(b){ b.table=el.value; CFG.dirtyList=true; await publish(); } });
    each(".wb","click",  async el => { const b=CFG.wall.find(x=>x.id===el.dataset.id); if(b){ b.bound=!b.bound; CFG.dirtyList=true; await publish(); render(); } });
    each(".wx","click",  async el => { CFG.wall = CFG.wall.filter(x=>x.id!==el.dataset.id); CFG.dirtyList=true; await publish(); render(); });
    on("wAdd","click", async () => { CFG.wall = CFG.wall||[]; CFG.wall.push({id:"w"+uid(),label:"",table:"",bound:true}); CFG.dirtyList=true; await publish(); render(); });

    on("seed","click", async () => { await seedRehearsal(); render(); });
    on("golive","click", async () => {
      if(!confirm("Ir para ao vivo: apaga as respostas de ensaio e as contagens, e volta à fase inicial. Continuar?")) return;
      await wipeAll();
      CFG.rehearsal = false; CFG.phase = "setup"; delete CFG.tally;
      await publish(); render();
    });
    on("wipe","click", async () => {
      if(!confirm("Apagar todas as respostas da sala?")) return;
      for(const k of await S.list(K_RESP, true)) await S.del(k, true);
      CFG.rehearsal = false; await publish(); await pull(); render();
    });
    on("reset","click", async () => {
      /* it sits next to buttons used live, and at 13:40 it would be unrecoverable */
      const typed = prompt("Recomeçar a sala apaga TODAS as respostas, o muro e a fase.\n" +
        "Isto não se desfaz. Escreva APAGAR para continuar.");
      if((typed||"").trim().toUpperCase() !== "APAGAR") return;
      for(const k of await S.list(K_RESP, true)) await S.del(k, true);
      await S.del(K_CFG, true); MINE = {}; await saveMine();
      CFG = await loadSeed(); CFG.phase="setup"; CFG.overrides={}; CFG.rehearsal=false;
      await publish(); await pull(); render();
    });
    on("exp","click", () => {
      document.getElementById("io").value = JSON.stringify({ ...CFG, responses: RESP }, null, 2);
      document.getElementById("msg").textContent = "exportado para a caixa · copie";
    });
    on("imp","click", async () => {
      try {
        const d = JSON.parse(document.getElementById("io").value);
        if(d.responses){
          for(const r of d.responses) await S.set(K_RESP + r.pid, JSON.stringify(r), true);
          delete d.responses;
        }
        CFG = { phase:"setup", overrides:{}, rehearsal:false, ...d };
        await publish(); await pull(); render();
        document.getElementById("msg").textContent = "importado";
      } catch(e){ document.getElementById("msg").textContent = "não deu para ler esse JSON"; }
    });
  }
}

/* The slider must answer under the hand: repaint the svg and the count, and
   leave the rest of the page alone. */
function repaint(){
  const f = document.getElementById("fig");
  if(f) f.innerHTML = figureSVG(null);
  const c = document.getElementById("count");
  if(c) c.innerHTML = countLine();
}

/* A submitted answer is written to the device first and sent second, so a wifi
   drop mid-sort costs nothing and nobody has to sort twice. */
let PENDING_SEND = false;

async function flushMine(){
  if(!API) return;
  let raw = null;
  try { raw = localStorage.getItem(K_PEND); } catch(e){}
  if(!raw){ PENDING_SEND = false; return; }
  try {
    await api("/r", { method:"POST", body: JSON.parse(raw) });
    localStorage.removeItem(K_PEND);
    PENDING_SEND = false; NET.up = true;
    if(view() === "triagem") render();
  } catch(e){ NET.up = false; }
}

async function saveMine(){
  await S.set("snd:mine", JSON.stringify(MINE), false);
  const acts = acts_();
  const done = acts.length>0 && acts.every(a => MINE[a.id]);
  const rec = { pid: DID, choices: MINE, done, ts:new Date().toISOString() };
  await S.set(K_RESP + DID, JSON.stringify(rec), true);
  await pull();

  if(!API) return;
  const wire = { session: CFG.session, pid: DID, choices: MINE, done };
  try {
    await api("/r", { method:"POST", body: wire });
    PENDING_SEND = false; NET.up = true;
    try { localStorage.removeItem(K_PEND); } catch(e){}
  } catch(e){
    try { localStorage.setItem(K_PEND, JSON.stringify(wire)); } catch(e2){}
    PENDING_SEND = true; NET.up = false;
  }
}

/* A rehearsal room. Deterministic enough to be the same picture twice, and
   loud about being fake: the figure carries an "ensaio" stamp until it is wiped. */
/* A room of owners is more conservative than the outside read, which is the
   whole point of the 14:05 hinge. These mixes put the median reach near 0.46,
   so "hoje" floods about six of fourteen and "três anos" floods about ten,
   with the two slowest bands crossing 50% hold and standing up as polders. */
const REHEARSAL_MIX = {
  already:  [0.45, 0.40, 0.15],
  under_3:  [0.22, 0.48, 0.30],
  "3_to_7": [0.08, 0.37, 0.55],
  resists:  [0.02, 0.13, 0.85],
};
async function wipeAll(){
  for(const k of await S.list(K_RESP, true)) await S.del(k, true);
  await pull();
  if(API && KEY){
    try { await api(`/r?session=${encodeURIComponent(CFG.session||"")}`, { method:"DELETE", key:true });
          RESP = []; NET.up = true; }
    catch(e){ NET.up = false; NET.note = "as respostas na sala não foram apagadas"; }
  }
}

async function seedRehearsal(){
  const acts = CFG.activities||[];
  let s = 20260908;
  const rnd = () => (s = (s*1103515245 + 12345) % 2147483648) / 2147483648;
  for(let i=0;i<33;i++){
    const pid = "ens-" + String(i).padStart(2,"0");
    const choices = {};
    acts.forEach(a => {
      const mix = REHEARSAL_MIX[a.outside_read && a.outside_read.band] || [0.3,0.4,0.3];
      const r = rnd();
      const c = r < mix[0] ? "automate" : r < mix[0]+mix[1] ? "augment" : "hold";
      choices[a.id] = { c, k: CONF[Math.floor(rnd()*3)].k, ts:new Date().toISOString() };
    });
    await S.set(K_RESP + pid, JSON.stringify({ pid, choices, done:true, ts:new Date().toISOString() }), true);
  }
