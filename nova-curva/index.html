<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A nova curva</title>
<!--
  A nova curva · Uniodonto, Barcelona, 15 September 2026

  The simplified room (11 September). Five doors, all open at once:
    #/triagem    the relator only (relator card, &relator=1): the table's sort, after the reveal
    #/muro       the room's wall, read only
    #/curva      each person's curve: reduce or raise on the seven axes, each citing the room;
                 below them, the table's new axes (change request 4), two at most
    #/porta-voz  the relator only: today's line, and the table's wall with its arrows
    #/tela       the projector (the facilitator's laptop, with the key)
  and for the facilitator only, reached from ?f on the door:
    #/f          console: which session is open, the as-is, the view, merges, export
    #/relatorio  the session's report, with what the sort and the wall led us to expect

  No room code and no names. The console opens one session at a time and
  every phone writes to that one. rules.js is the one copy of the rules.
-->
<style>
:root{
  --bg:#193C3F; --bg2:#14333A; --panel:#1D4549; --line:#2C5457; --ink:#F4F0E9; --muted:#9FB4B0;
  --gold:#C6A553; --cream:#EDE3CC; --grey:#8FA09E; --amber:#E0A040; --bad:#E2876B; --ok:#8FC79A;
  --z-submerso:#4F8FAE; --z-linha:#7FB5AA; --z-polder:#8FAE62; --z-rocha:#A08E72;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Calibri,"Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 110px}
.wrap.wide{max-width:1180px}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif}
h1{font-size:34px;line-height:1.1;margin:6px 0 4px;text-wrap:balance}
h2{font-size:22px;margin:0 0 10px}
h1 .en,h2 .en{display:block;color:var(--muted);font-weight:400;font-size:.55em;margin-top:4px}
.kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)} .small{font-size:13.5px} .en2{display:block;color:var(--muted);font-size:.88em;margin-top:2px}
a{color:var(--gold)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.on{border-color:var(--gold);color:var(--gold);background:#22504F}
button.primary{border-color:var(--gold);color:var(--gold);width:100%;padding:14px}
button[disabled]{opacity:.45;cursor:not-allowed}
button.link{background:none;border:none;padding:0;color:var(--muted);text-decoration:underline}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.note{border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--muted);font-size:14.5px}
.note.warn{border-color:var(--amber);color:var(--amber)}
.loud{border:2px solid var(--bad);background:#4A2A26;border-radius:8px;padding:14px 16px}
.chip{display:inline-block;font-size:12.5px;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted);margin:2px 4px 2px 0}
.chip.lig{border-color:var(--gold);color:var(--gold)}
.chip.gen{border-style:dashed}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.chip.unc{border-color:var(--bad);color:var(--bad)}
.zsq{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:7px}
.lock{position:sticky;top:0;z-index:5;background:#4A2A26;padding:8px 14px;font-size:14px;border-bottom:1px solid var(--bad)}
.num{font-variant-numeric:tabular-nums}

/* the door */
.doors{display:grid;gap:10px;margin-top:22px}
.door{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;text-decoration:none;color:var(--ink);
      background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:15px 18px}
.door:hover{border-color:var(--gold)}
.door b{font-family:Georgia,serif;font-size:23px;font-weight:700}
.door b i{font-style:normal;font-weight:400;font-size:14px;color:var(--muted);margin-left:8px}
.door .st{font-size:13px;color:var(--gold);text-align:right}
.door .d{grid-column:1/-1;color:var(--muted);font-size:14.5px}

/* the sort, one task at a time, the places stacked */
.task{font-family:Georgia,serif;font-size:25px;line-height:1.25;margin:10px 0 2px}
.choices{display:grid;gap:10px;margin-top:18px}
.choice{text-align:left;padding:14px 16px;display:grid;gap:4px}
.choice b{font-size:18px}
.choice b i{font-style:normal;font-weight:400;color:var(--muted)}
.choice span{font-size:13.5px;color:var(--muted)}
.answers{display:grid;gap:6px;margin-top:14px}
.zrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:6px}
.zb{padding:8px 2px;font-size:12px;line-height:1.15}
.zb .zsq{margin-right:3px}
.answers button{text-align:left;display:flex;justify-content:space-between;gap:10px;padding:9px 12px;font-size:14px}

/* the wall */
.wrow{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
/* change request 7: the relator's one screen */
.rhead{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--gold);padding:10px 18px 8px}
.rmesa{font:700 30px/1.1 Georgia,serif;color:var(--cream);letter-spacing:.02em}
.rstep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.rstep.shut{opacity:.45}
.rstep.open{border-color:var(--gold)}
.rrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rrow b{font:700 19px Georgia,serif}
.rrow .st{font-size:13px;color:var(--gold);text-align:right}
.rstep .card > p.small.muted:first-of-type{display:none}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center;padding:3px 0}
.prow b{font-size:14px;line-height:1.2;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.prow button{padding:10px 2px;font-size:14px}
.wallrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}

/* the curve */
.axis{padding:14px 0;border-bottom:1px solid var(--line)}
.axis .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.axis .hd b{font-family:Georgia,serif;font-size:19px}
.pace{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:2px}
input[type=range]{padding:0;border:none;background:none;accent-color:var(--gold);height:32px}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 4px}
.cbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 14px;margin-top:18px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg2);border-top:2px solid var(--gold);padding:18px 18px 26px;z-index:20}
.sheet .inner{max-width:560px;margin:0 auto}
.pick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;margin:6px 0;gap:2px}
.pick.on{border-color:var(--gold)}
.pick small{color:var(--muted)}
.chart svg{display:block;width:100%;height:auto}

/* the console */
.sec{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.seslist{display:grid;gap:8px}
.ses{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:12px}
.tbl{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:400}

/* the projector, read at eight metres */
.tela{padding:34px 48px 40px;min-height:100vh}
.tela h1{font-size:54px}
.tela .lede{font-size:26px;color:var(--muted);margin:4px 0 22px}
.tela .foot{font-size:32px;margin-top:22px}
.srow{display:grid;grid-template-columns:minmax(0,32%) 1fr minmax(0,24%);gap:18px;align-items:center;padding:6px 0;font-size:21px;border-bottom:1px solid var(--line)}
.bar4{display:flex;height:30px;border-radius:4px;overflow:hidden;background:var(--bg2)}
.bar4 div{height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0E2427;font-weight:700}
.legend{display:flex;gap:22px;font-size:18px;color:var(--muted);margin:0 0 12px;flex-wrap:wrap}
.twall{display:grid;grid-template-columns:1fr auto;gap:6px 24px;font-size:24px}
.twall div{padding:6px 0;border-bottom:1px solid var(--line)}
.xgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:16px}
.xcol{border-top:3px solid var(--line);padding-top:10px;font-size:18px;line-height:1.35}
.xcol{min-width:0;overflow-wrap:anywhere;hyphens:auto}
.xcol b{font-family:Georgia,serif;font-size:24px;display:block}
@media (max-width:1100px){ .xgrid{grid-template-columns:repeat(4,minmax(0,1fr))} .tela{padding:24px 28px} }
.xcol .ex{color:var(--gold);margin:6px 0}
.xcol .f{margin-top:10px}
.xcol .f.tension{color:var(--amber)}
.xcol .q{color:var(--muted);font-size:16px;margin-top:10px}
/* change request 4: the created axes, beside the seven and never inside them */
.movewrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,20%);gap:30px;align-items:start}
.newax{border-left:2px solid var(--gold);padding-left:22px}
.newax .nx{padding:10px 0;border-bottom:1px solid var(--line);font-size:18px;line-height:1.35}
.newax .nx b{font-family:Georgia,serif;font-size:23px;display:block;line-height:1.2}
.newax .q{color:var(--muted);font-size:16px;margin-top:4px}
/* change request 5: the commitments, option tag first */
.crow{padding:9px 0;border-bottom:1px solid var(--line)}
.ctag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:3px;margin-right:8px;border:1px solid var(--gold);color:var(--gold);vertical-align:2px}
.ctag.polder{border-color:var(--z-polder);color:var(--z-polder)}
.tela .crow{font-size:24px;line-height:1.35;padding:14px 0}
.tela .ctag{font-size:15px}
.crow .who{color:var(--muted)}
/* the terrain and the gate, as at Unimed */
.fig{display:flex;gap:30px;align-items:flex-start}
.fig .terrain{flex:1.75;min-width:0}
.gate{flex:1;min-width:0;border-left:2px solid var(--line);padding-left:26px}
.bricks{margin-top:12px}
.brick{display:flex;gap:14px;align-items:flex-start;font-size:23px;line-height:1.25;padding:10px 0;border-bottom:1px solid var(--line)}
.brick small{display:block;font-size:16px;color:var(--muted);margin-top:3px}
.brick .mark{width:20px;height:20px;border:2.5px solid var(--gold);flex:none;margin-top:4px}
.brick .mark.filled{background:var(--gold)}
.brick.in{animation:brickin .55s ease-out both;animation-delay:calc(var(--i) * .28s)}
@keyframes brickin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.stamp{position:fixed;right:14px;bottom:10px;font-size:12px;letter-spacing:.2em;color:var(--amber)}

/* the report */
.rep{max-width:980px;margin:0 auto;padding:28px 28px 60px}
.rep h2{margin-top:34px}
.rep h3{font-family:Georgia,serif;font-size:19px;margin:22px 0 4px}
.rep .f{padding:4px 0 4px 12px;border-left:3px solid var(--line);margin:6px 0}
.rep .f.tension{border-left-color:var(--amber)}
.rep .f.coherent{border-left-color:var(--ok)}
.rep .f.check{border-left-color:var(--gold)}
.rep blockquote{margin:6px 0;padding-left:12px;border-left:1px solid var(--line);color:var(--muted)}
@media print{
  html,body{background:#fff;color:#111}
  .noprint{display:none!important}
  .rep .f{border-left-color:#999} .muted,.en2,.rep blockquote{color:#555}
  table.t td,table.t th{border-color:#ccc;color:#111}
  a{color:#111}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script src="live-room.js?b=22"></script>
<script src="rules.js?b=22"></script>
<script src="rehearsal.js?b=22"></script>
<script>
"use strict";
const R = window.NCRULES;
const BUILD = 19;

/* ---------------------------------------------------------------- storage */
/* ?p= gives a second device in the same browser, for rehearsing on one laptop. */
const NS = new URLSearchParams(location.search).get("p") || "";
const MEM = {};
const S = {
  k: k => "nc" + NS + ":" + k,
  get(k){ try { return localStorage.getItem(this.k(k)); } catch(e){ return MEM[k] ?? null; } },
  set(k, v){ try { localStorage.setItem(this.k(k), v); } catch(e){ MEM[k] = v; } },
  del(k){ try { localStorage.removeItem(this.k(k)); } catch(e){ delete MEM[k]; } },
  getJ(k, d){ try { const v = this.get(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  setJ(k, v){ this.set(k, JSON.stringify(v)); },
};

/* ------------------------------------------------------------------ utils */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = v => v == null ? "—" : (Math.round(v * 10) / 10).toFixed(1).replace(".", ",");
const param = k => new URLSearchParams(location.search).get(k);
const hhmm = iso => { if(!iso) return ""; const d = new Date(iso); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
/* the counts in the copy come from the session: twelve cards in the morning, sixteen in the afternoon */
const NUM_PT = ["zero", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove", "dez", "onze", "doze", "treze", "catorze", "quinze", "dezasseis", "dezassete", "dezoito", "dezanove", "vinte"];
const numPt = k => NUM_PT[k] || String(k);
const route = () => location.hash.replace(/^#\/?/, "").split("/")[0] || "";
const ZCOL = { submerso: "var(--z-submerso)", linha: "var(--z-linha)", polder: "var(--z-polder)", rocha: "var(--z-rocha)", sem_acordo: "#B7AFA0" };
const ZHEX = { submerso: "#4F8FAE", linha: "#7FB5AA", polder: "#8FAE62", rocha: "#A08E72", sem_acordo: "#B7AFA0" };
const cardNo = t => String(t.code || "").replace(/^T0?/, "");
/* the arrow belongs to a bound card; a generic one carries none, whatever its minority said */
const arrowGlyph = g => !g || !g.ligado ? "" : g.arrow === "escasso" ? "↑" : g && g.arrow === "estavel" ? "→" : g && g.arrow === "abundante" ? "↓" : "";
const zsq = z => z && ZCOL[z] ? `<span class="zsq" style="background:${ZCOL[z]}"></span>` : "";
const SHORT = { price: "Preço", network: "Rede", complaints: "Reclamações", ortho_specialist: "Ortodontia",
                digital: "Digital", continuity: "Continuidade", employer_reporting: "Relatório" };
const short = a => SHORT[a.code] || a.label_pt;
/* One curve, two buyers: the employer buys the plan, the beneficiary chooses
   the dentist. Each axis says whose it is (session.json, side). */
const SIDES = [{ key: "employer", pt: "O empregador", en: "what the employer buys" },
               { key: "beneficiary", pt: "O beneficiário", en: "what the beneficiary chooses" }];
const sideOf = a => a && a.side === "beneficiary" ? "beneficiary" : a && a.side === "employer" ? "employer" : "";
const sideWord = a => ({ employer: "empregador", beneficiary: "beneficiário" })[sideOf(a)] || "";
/* Change request 6: the morning's seven axes are one group; the cooperado is supplier, customer and owner at once */
const sidesOn = axes => (axes || []).some(a => a.side === "employer" || a.side === "beneficiary");
/* The projector's six screens, in the order the day uses them. The console
   steps through them one press at a time: no menu to pick the wrong one from. */
const SEQ = [["asis", "A curva de hoje"], ["sort", "A maré"], ["wall", "O muro"],
             ["overlay", "Todas as curvas"], ["moves", "Os movimentos"], ["expected", "O que se esperava"], ["commit", "Os compromissos"]];
const toggle = (list, id) => { const i = list.indexOf(id); if(i >= 0) list.splice(i, 1); else list.push(id); };
/* Five positions against the rival (change request 2): the room's morning
   line sits one step either side of Odontoprev, or level with it. */
const VMAX = R.LIMITS.VALUE_MAX;
const fmtRel = v => { if(v == null) return "—"; const d = Math.round((v - R.RIVAL_VALUE) * 10) / 10;
                      return d === 0 ? "igual" : (d > 0 ? "+" : "−") + String(Math.abs(d)).replace(".", ","); };
const scaleWord = v => v == null ? "—" : Number.isInteger(v) ? R.SCALE_PT[v] : fmtRel(v);
/* The outside read: the desk work, where public sources could read anything.
   Only its direction against the rival is drawn, and it is never the ghost. */
const outsideMark = (you, rival) => you == null || rival == null ? null : you - rival > 0.5 ? 3 : rival - you > 0.5 ? 1 : 2;
function hash32(s){ let h = 2166136261 >>> 0; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a += 0x6D2B79F5; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mintPid(){
  const a = "abcdefghijklmnopqrstuvwxyz0123456789", b = new Uint8Array(24);
  crypto.getRandomValues(b); let s = ""; for(const x of b) s += a[x % a.length]; return s;
}

/* ------------------------------------------------------------------ state */
let SEED = null, API = null, KEY = null, PID = null;
let ST = null;                              /* GET /state: the open session and the room's aggregate */
let SORT = null, WALL = null, CURVE = null, PLACE = null, COMMIT = null; /* this device's own, for the open session */
let SID = null, ROOM = null, SESSIONS = [], ACTIVE = null;
let NET = { up: null, note: "" };
let SHEET = null, NOTE = "", BUSY = false, PENDING_RENDER = false;
let LINE_EDIT = false, CLAIMING = false;         /* the console's corrections to today's line stay hidden until asked for */
let MESA = null;                                 /* the table, from the table's QR: ?mesa=N */
let RELATOR = false;                             /* the relator's card adds &relator=1: only that phone sees Triagem and Porta-voz */
const LAST = { state: 0, room: 0, sessions: 0 };
const TIMERS = {};
const debounce = (k, ms, fn) => { clearTimeout(TIMERS[k]); TIMERS[k] = setTimeout(fn, ms); };

async function api(path, o = {}){
  if(!API){ const e = new Error("no backend"); e.status = 0; throw e; }
  const headers = {};
  if(o.body) headers["content-type"] = "application/json";
  if(o.key){ if(!KEY){ const e = new Error("no key"); e.status = 401; throw e; } headers["x-key"] = KEY; }
  let r;
  try { r = await fetch(API + path, { method: o.method || "GET", headers, body: o.body ? JSON.stringify(o.body) : undefined, cache: "no-store" }); }
  catch(e){ NET.up = false; const x = new Error("offline"); x.status = 0; throw x; }
  NET.up = true;
  const data = await r.json().catch(() => null);
  if(!r.ok){ const e = new Error((data && data.error) || ("http " + r.status)); e.status = r.status; e.data = data; throw e; }
  return data;
}

/* 25 September: the projector's four-character code, so a facilitator never has to compute
   it by hand. The key holder asks the Worker, which derives it the same way it checks it.
   Fetched once a day: setting TELA stops the next render asking again. */
let TELA = null;
function pullTelaCode(){
  if(!KEY || (TELA && TELA.day === new Date().toISOString().slice(0, 10))) return;
  if(pullTelaCode.busy) return;
  pullTelaCode.busy = true;
  api("/f/tela-code", { key: true })
    .then(d => { TELA = d; safeRender(); })
    .catch(() => {})
    .then(() => { pullTelaCode.busy = false; });
}

/* ------------------------------------------------------------------- boot */
async function boot(){
  SEED = await loadSeed();
  /* a phone holding an old copy of this file cannot be fixed by anything inside it */
  if(SEED && SEED.build && SEED.build > BUILD && !/[?&]b=/.test(location.search)){
    location.replace(location.pathname + "?b=" + SEED.build + location.hash); return;
  }
  API = (param("api") || (SEED && SEED.api) || "").replace(/\/+$/, "") || null;
  /* the key arrives once, in the address, and lives in this browser only */
  const k = param("k");
  if(k){ KEY = k; S.set("key", k); const u = new URL(location.href); u.searchParams.delete("k"); history.replaceState(null, "", u.pathname + u.search + u.hash); }
  else KEY = S.get("key");
  PID = S.get("pid"); if(!PID){ PID = mintPid(); S.set("pid", PID); }
  SID = param("s") || S.get("sid");
  /* the table tent's QR carries its table, and the phone keeps it */
  const pm = Number(param("mesa"));
  if(pm >= 1 && pm <= 12){
    if(String(pm) !== S.get("mesa")) S.del("relator");   /* another table's QR: not its relator */
    MESA = pm; S.set("mesa", String(pm));
  } else { const sm = Number(S.get("mesa")); MESA = sm >= 1 && sm <= 12 ? sm : null; }
  /* the relator's card: the tent's address plus &relator=1, remembered like the table */
  if(param("relator") === "1") S.set("relator", "1");
  RELATOR = S.get("relator") === "1";
  ST = S.getJ("state", null);
  atTable();
  loadMine();
  addEventListener("hashchange", () => { SHEET = null; render(); tick(true); window.scrollTo(0, 0); });
  addEventListener("online", () => tick(true));
  document.addEventListener("visibilitychange", () => { if(!document.hidden) tick(true); });
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onChange);
  document.addEventListener("focusout", () => { if(PENDING_RENDER){ PENDING_RENDER = false; setTimeout(render, 150); } });
  render();
  setInterval(() => tick(false), 2500);
  tick(true);
}
async function loadSeed(){
  try { const r = await fetch("session.json", { cache: "no-store" }); if(r.ok) return await r.json(); } catch(e){}
  return null;
}

const sessId = () => ST && ST.session ? ST.session.id : null;
const mk = k => "s:" + sessId() + ":" + k;
const blankRows = () => Array.from({ length: R.LIMITS.WALL_ROWS }, () => ({ name: "", ligado: null }));
function loadMine(){
  if(!sessId()){ SORT = WALL = CURVE = PLACE = COMMIT = null; return; }
  COMMIT = S.getJ(mk("commit"), null) || blankCommit();
  COMMIT.pre = COMMIT.pre || {}; COMMIT.raise = COMMIT.raise || { axis_id: null, sees: "" };
  SORT = S.getJ(mk("tsort"), null) || { choices: {}, submittedAt: null, err: null, sending: false, forceEdit: false };
  WALL = S.getJ(mk("wall"), null) || { table: null, given: {}, rows: blankRows(), dirty: false, savedAt: null, taken: false, takeover: false };
  WALL.given = WALL.given || {};
  WALL.arrows = WALL.arrows || {};
  WALL.rows = (WALL.rows || []).slice(0, R.LIMITS.WALL_ROWS); while(WALL.rows.length < R.LIMITS.WALL_ROWS) WALL.rows.push({ name: "", ligado: null });
  PLACE = S.getJ(mk("placement"), null) || { choices: {}, err: null };
  CURVE = S.getJ(mk("curve"), null) || { buyer: null, moves: {}, submitted: false, dirty: false, pendingSubmit: false, err: null, savedAt: null };
}
const saveSort = () => S.setJ(mk("tsort"), SORT);
const saveWall = () => S.setJ(mk("wall"), WALL);
const saveCurve = () => S.setJ(mk("curve"), CURVE);
const savePlace = () => S.setJ(mk("placement"), PLACE);
const saveCommit = () => { S.setJ(mk("commit"), COMMIT); autoCommit(); };
/* 15 September: the commitment sends itself once complete, and again after each change;
   the button stays as reassurance. csend saves without calling this, so nothing loops. */
function autoCommit(){
  debounce("commitauto", 1500, () => {
    if(!COMMIT || !COMMIT.option || !CMT || !CMT.context || CMT.sending || (CMT.taken && !CMT.steward)) return;
    if(!R.validateCommit(COMMIT, ctxNow(), CMT.context).ok) return;
    if(JSON.stringify(commitPayload()) === COMMIT.sentSig) return;
    ACT.csend();
  });
}

/* ------------------------------------------------------------------ polls */
const PHONE = ["", "triagem", "curva", "porta-voz", "compromisso"];
const FACIL = ["f", "tela", "relatorio"];
async function tick(force){
  if(document.hidden && !force) return;
  if(!API){ return; }
  const r = route(), t = Date.now();
  if(PHONE.includes(r)){
    if(force || t - LAST.state >= (r ? 12000 : RELATOR ? 5000 : 20000)){ LAST.state = t; await pollState(); }
    await flush();
    if(r === "triagem") await loadMesa(false);
    if(r === "curva") await loadCreated(false);
    if(r === "compromisso") await loadCommit(false);
    /* the relator's one screen loads whatever step the console has open */
    if(r === "" && RELATOR && ST && ST.session){ if(ST.session.step === "sort") await loadMesa(false); if(ST.session.step === "commit") await loadCommit(false); }
  }
  if(FACIL.includes(r) && KEY){
    /* the projector follows the session the phones write to, so the afternoon room never sees the
       morning's screens, and shows nothing while no session is open; the report follows the
       console's pick; an address with ?s= pins either */
    if(r === "tela" && !param("s")){
      if(force || t - LAST.sessions >= 5000){ LAST.sessions = t; await pollSessions(); }
      if((ACTIVE || null) !== SID){ SID = ACTIVE || null; ROOM = null; safeRender(); }
    }
    else if(r !== "f" && !param("s")){ const cur = S.get("sid"); if(cur && cur !== SID){ SID = cur; ROOM = null; } }
    if(r === "f" && (force || t - LAST.sessions >= 15000)){ LAST.sessions = t; await pollSessions(); }
    if(force || t - LAST.room >= 4500){ LAST.room = t; if(SID) await pollRoom(); }
  }
}
function safeRender(){
  const a = document.activeElement;
  if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== "range" && a.type !== "checkbox"){ PENDING_RENDER = true; return; }
  render();
}
async function pollState(){
  try {
    const since = ST && ST.session ? "?since=" + ST.session.data_v : "";
    const d = await api("/state" + since);
    if(d.unchanged){ safeRender(); return; }
    const prev = sessId(); ST = d; S.setJ("state", d); atTable();
    if(sessId() !== prev){ loadMine(); TBL = null; TBL_AT = 0; AXN.list = []; AXN.at = 0; AXN.form = null; AXN.err = null; CMT = null; CMT_AT = 0; }
  } catch(e){}
  safeRender();
}
async function pollSessions(){
  try { const d = await api("/f/sessions", { key: true }); SESSIONS = d.sessions; ACTIVE = d.active; NET.note = "";
        if(!SID && ACTIVE){ SID = ACTIVE; S.set("sid", SID); } }
  catch(e){ NET.note = e.status === 401 ? "a chave não foi aceite" : ""; }
  safeRender();
}
async function pollRoom(){
  try {
    const since = ROOM && ROOM.session && ROOM.session.id === SID ? "&since=" + ROOM.session.data_v : "";
    const d = await api(`/f/room?session_id=${encodeURIComponent(SID)}${since}`, { key: true });
    if(d.unchanged){ if(ROOM && ROOM.session.active !== d.active){ ROOM.session.active = d.active; safeRender(); } return; }
    ROOM = d; ROOM.D = derive(d);
  } catch(e){ if(e.status === 404){ SID = null; S.del("sid"); ROOM = null; } }
  safeRender();
}
const refetchRoom = async () => { if(ROOM) ROOM.session.data_v = -1; await pollRoom(); };

/* --------------------------------------------------------------- the pushes */
async function flush(){
  if(!sessId()) return;
  if(WALL && WALL.dirty && WALL.table && !WALL.taken) await pushWall();
  if(CURVE && CURVE.dirty) await pushCurve(CURVE.pendingSubmit);
}
/* The console moved to another session, or closed it: start fresh there. */
function sessionChanged(e){
  if(e.status === 409 && e.data && (e.data.session_id || e.data.closed)){
    if(ST && ST.session) ST.session.data_v = -1;
    LAST.state = 0; pollState(); return true;
  }
  return false;
}
async function claimSeat(){
  try {
    const d = await api("/wall", { method: "PUT", body: { pid: PID, session_id: sessId(), mesa: MESA, claim: true, takeover: !!WALL.takeover } });
    WALL.table = d.table; WALL.taken = false; WALL.takeover = false;
    const mine = WALL.rows.some(r => r.name.trim()) || Object.keys(WALL.given || {}).length > 0;
    if(!mine){ const rows = blankRows(); (d.cards || []).slice(0, rows.length).forEach((c, i) => { rows[i] = { name: c.name, ligado: c.ligado, arrow: c.arrow || null }; });
               WALL.rows = rows; WALL.given = d.given || {}; WALL.arrows = d.arrows || {}; }
    saveWall();
    if(mine){ WALL.dirty = true; await pushWall(); }
  } catch(e){
    if(e.status === 409 && e.data && e.data.taken){ WALL.taken = true; saveWall(); }
    else sessionChanged(e);
  }
  CLAIMING = false;
  render();
}
async function pushWall(){
  try {
    await api("/wall", { method: "PUT", body: { pid: PID, session_id: sessId(), mesa: MESA, given: WALL.given, arrows: WALL.arrows || {}, cards: WALL.rows } });
    WALL.dirty = false; WALL.savedAt = new Date().toISOString(); saveWall();
  } catch(e){
    if(e.status === 409 && e.data && e.data.taken){ WALL.taken = true; saveWall(); }
    else if(!sessionChanged(e) && e.status === 400){ NOTE = e.message; WALL.dirty = false; }
  }
  safeRender();
}
function movesPayload(){
  return Object.keys(CURVE.moves).map(id => { const m = CURVE.moves[id];
    return { axis_id: id, direction: m.direction, to_value: m.to_value, cites_task_ids: m.cites_task_ids || [], cites_wall_ids: m.cites_wall_ids || [],
             offer_only: !!m.offer_only, offer_reason: m.offer_reason || null, note: m.note || null }; });
}
/* 15 September: a curve is sent as soon as it is complete (a reduction, every move valid),
   and again after each change; no one has to find the button */
function curveReady(){
  if(!ST || !ST.axes || !CURVE) return false;
  const ctx = ctxNow(), axes = ST.axes;
  const moves = Object.keys(CURVE.moves).map(id => ({ axis_id: id, ...CURVE.moves[id] }));
  return moves.length > 0 && R.validateCurve(moves).ok && moves.every(m => { const a = axes.find(x => x.id === m.axis_id); return a && R.validateMove(m, ctx, a).ok; });
}
async function pushCurve(submit){
  submit = submit || curveReady();
  try {
    const d = await api("/curve", { method: "PUT", body: { pid: PID, session_id: sessId(), mesa: MESA, buyer: CURVE.buyer, moves: movesPayload(), submit: !!submit } });
    CURVE.dirty = false; CURVE.pendingSubmit = false; CURVE.err = null; CURVE.savedAt = new Date().toISOString(); CURVE.submitted = !!d.submitted;
    saveCurve();
  } catch(e){
    if(e.status === 422){ CURVE.dirty = false; CURVE.pendingSubmit = false; CURVE.submitted = false; CURVE.err = e.data; saveCurve(); }
    else if(sessionChanged(e)){}
    else if(e.status === 400){ CURVE.dirty = false; CURVE.pendingSubmit = false; CURVE.err = { error: e.message }; saveCurve(); }
    /* offline: it stays dirty and goes when the network comes back */
  }
  safeRender();
}
function ctxNow(){
  if(!ST || !ST.session) return null;
  return R.citeContext({ tasks: ST.tasks, sort: ST.cite, groups: ST.cite.wall, generic: ST.generic });
}

let TBL = null, TBL_AT = 0;
async function loadMesa(force){
  if(!sessId()) return;
  if(!force && Date.now() - TBL_AT < 8000) return;

  try { TBL = await api(`/mesa?session_id=${encodeURIComponent(sessId())}&pid=${PID}${MESA ? `&mesa=${MESA}` : ""}`); } catch(e){}
  safeRender();

async function submitSort(){
  SORT.sending = true; SORT.err = null; saveSort(); render();
  try {
    const d = await api("/sort", { method: "PUT", body: { pid: PID, session_id: sessId(), mesa: MESA, choices: SORT.choices, submit: true, takeover: !!SORT.forceEdit } });
    SORT.submittedAt = d.submitted_at; SORT.forceEdit = false;
    if(WALL && !WALL.table) { WALL.table = d.table; saveWall(); }
  } catch(e){
    if(e.status === 409 && e.data && e.data.taken) SORT.err = "taken";
    else if(!sessionChanged(e)) SORT.err = e.status === 0 ? "Sem rede. A triagem fica neste telefone; tente de novo." : e.message;
  }
  SORT.sending = false; saveSort(); TBL_AT = 0; await loadMesa(true); render();
}

      <input data-axname="1" maxlength="${R.LIMITS.AXIS_NAME_MAX}" value="${esc(f.name)}" placeholder="por exemplo: segunda opinião garantida em 48 horas" style="margin-top:6px">
      <div class="kick" style="margin-top:14px">Carta do muro <span class="muted">obrigatória: nossa e mais escassa</span></div>
      ${ctx.wallMode === "fallback" ? `<div class="note warn">A sala ainda não tem muro: lista genérica.</div>` : ""}
      ${ctx.wall.map(pickW).join("")}
      <div class="kick" style="margin-top:14px">Carta de pôlder <span class="muted">opcional: um momento humano guardado, promovido a promessa</span></div>
      ${R.polderCandidates(ctx).map(pickP).join("")}
      ${v.amber ? `<div class="note warn" style="margin-top:8px">${esc(R.msgPt("amber"))}</div>` : ""}
      ${(f.name.trim() || f.wall_id) && !v.ok ? `<div class="small" style="color:var(--bad);margin-top:8px">${esc(R.msgPt(v.errors[0]))}</div>` : ""}
      <div class="row" style="margin-top:12px;flex-wrap:nowrap"><button class="primary" data-act="axsave" ${v.ok && !AXN.busy ? "" : "disabled"}>Criar o eixo</button>
        <button class="link" data-act="axcancel">cancelar</button></div></div>`;
}
function refreshAxButton(){
  const btn = document.querySelector("[data-act=axsave]"); if(!btn || !AXN.form) return;

function viewCurva(){

  const ctx = ctxNow(), axes = ST.axes;
  const moves = Object.keys(CURVE.moves).map(id => ({ axis_id: id, ...CURVE.moves[id] }));
  const cv = R.validateCurve(moves);
  const bad = moves.filter(m => { const a = axes.find(x => x.id === m.axis_id); return !a || !R.validateMove(m, ctx, a).ok; });
  const missing = axes.filter(a => axisBase(a) == null);
  const canSubmit = cv.ok && !bad.length && moves.length > 0;
  const banners = [];
  if(ctx.taskMode === "fallback") banners.push(`A triagem da sala ainda tem menos de ${R.LIMITS.MIN_SORT} respostas: todas as tarefas ficam abertas para citar, e as baixas ficam marcadas sem citação.`);
  if(ctx.wallMode === "fallback") banners.push("A sala ainda não tem muro: cite da lista genérica, e as elevações ficam marcadas sem citação.");
  if(missing.length) banners.push(missing.length === axes.length
    ? (tableScope() && !MESA ? "Sem mesa: abra pela tenda da sua mesa para partir da curva de hoje dela. Os cursores começam ao meio, igual ao rival, e não há linha tracejada."
       : tableScope() ? `A curva de hoje da Mesa ${MESA} ainda não entrou: os cursores começam ao meio, igual ao rival da mesa, e não há linha tracejada.`
       : `A curva de hoje ainda não entrou: os cursores começam ao meio, igual à ${esc(rivalWord())}, e não há linha tracejada.`)
    : `Sem a curva de hoje em ${missing.map(a => esc(a.label_pt)).join(", ")}: o cursor começa ao meio e não há linha tracejada.`);
  return `${head("A sua curva", "Your curve · silent, alone, eight minutes")}
    ${banners.map(b => `<div class="note warn" style="margin-top:10px">${b}</div>`).join("")}
    <p class="muted" style="margin-top:14px">${sidesOn(axes) ? "Dois compradores, uma curva. À esquerda, o que o empregador compra; à direita, o que o beneficiário escolhe." : `Uma curva, ${axes.length} eixos.`} A tracejado, a curva de hoje${tableScope() ? " da sua mesa" : ""}; a cinzenta, ao meio, é ${esc(rivalWord())}. Mexa só onde tem uma razão.
      <span class="en2">${sidesOn(axes) ? "Two buyers, one curve. Left, what the employer buys; right, what the beneficiary chooses." : `One curve, ${axes.length} axes.`} Dashed, today's line${tableScope() ? " at your table" : ""}; the grey one in the middle is ${esc(rivalWord())}. Move only where you have a reason.</span></p>
    <div class="chart">${curveSVG(axes, [{ vals: axes.map(curVal), color: "#C6A553", w: 2.5, dots: true }], { asis: true, rival: true, sides: true })}</div>
    ${!sidesOn(axes) ? `<div style="margin-top:18px">${axes.map(a => axisRow(a, ctx)).join("")}</div>` : SIDES.map(sd => { const list = axes.filter(a => sideOf(a) === sd.key);
      return list.length ? `<div class="kick" style="margin-top:22px">${sd.pt} <span class="muted">${sd.en}</span></div>${list.map(a => axisRow(a, ctx)).join("")}` : ""; }).join("")}
    ${createdHTML(ctx)}
    <div class="cbar">
      <div class="small">elevações <b>${cv.raises}</b> · baixas <b>${cv.lowers}</b> (pelo menos 1) ·
        ${CURVE.submitted ? "<b>enviada</b>" : CURVE.dirty ? "a guardar…" : moves.length ? "rascunho guardado" : ""}</div>
      ${!cv.ok && moves.length ? `<div class="small" style="color:var(--bad);margin-top:4px">${esc(R.msgPt("needs_lower"))}</div>` : ""}
      ${CURVE.err ? `<div class="small" style="color:var(--bad);margin-top:4px">${esc(errText(CURVE.err))}</div>` : ""}
      <button class="primary" style="margin-top:8px" data-act="submitcurve" ${canSubmit ? "" : "disabled"}>${CURVE.submitted ? "Enviada · enviar de novo" : "Enviar a minha curva"} <span class="muted">submit</span></button>
    </div></div>${SHEET ? sheetHTML(ctx) : ""}`;
}
/* Pace: one word under the axis label, and nothing else. Context for the
   participant's own judgement, never a warning and never a weight. */
function paceLine(a, ctx){
  const p = R.pace(ctx, a.code);
  return p ? `<div class="pace" title="o ritmo a que este eixo se move sem ninguém o mover, pela triagem da sala">${R.PACE_PT[p]}</div>` : "";
}
function axisRow(a, ctx){
  const m = CURVE.moves[a.id], base = axisBase(a);
  const v = m ? R.validateMove(m, ctx, a) : null;
  const hints = [];
  if(R.axisUntagged(ST.tasks, a.code)) hints.push("Nenhuma tarefa o produz: a automação não o pode baixar. Baixá-lo é uma decisão de oferta.");
  return `<div class="axis"><div class="hd"><b>${esc(a.label_pt)}</b><span class="muted serif">hoje: ${esc(scaleWord(base))}</span></div>
    ${paceLine(a, ctx)}
    ${a.polarity ? `<div class="small muted">${esc(a.polarity)}</div>` : ""}
    ${hints.map(h => `<div class="small muted" style="font-style:italic">${h}</div>`).join("")}
    <input type="range" min="0" max="${VMAX}" step="1" value="${m ? m.to_value : (base != null ? Math.round(base) : R.RIVAL_VALUE)}" data-ax="${esc(a.id)}" aria-label="${esc(a.label_pt)}">
    <div class="ticks">${R.SCALE_PT.map(w => `<span>${w}</span>`).join("")}</div>
    ${m ? `<div style="margin-top:6px">${moveChips(m, ctx, v)} <button class="link" data-act="editmove" data-ax="${esc(a.id)}">mudar</button> · <button class="link" data-act="dropmove" data-ax="${esc(a.id)}">tirar</button></div>` : ""}
  </div>`;
}
function moveChips(m, ctx, v){
  const tById = R.index(ctx.tasks);
  const out = [`<span class="chip lig">${R.DIR_PT[m.direction]} → ${m.to_value}</span>`];
  for(const id of m.cites_task_ids || []) if(tById[id]) out.push(`<span class="chip">${zsq(tById[id].place)}${esc(tById[id].short_pt)}</span>`);
  for(const id of m.cites_wall_ids || []){ const w = ctx.wallIndex[id]; if(w) out.push(`<span class="chip ${w.ligado ? "lig" : "gen"}">${esc(w.name)}</span>`); }
  if(m.offer_only) out.push(`<span class="chip">só oferta: ${esc(m.offer_reason || "")}</span>`);
  if(v && v.amber) out.push(`<span class="chip amber" title="${esc(R.msgPt("amber"))}">nosso mas estável</span>`);
  /* the pôlder fallback is silent: a room that kept nothing dry is normal, not a failure */
  const loud = (R.LOWER.includes(m.direction) && !m.offer_only && ctx.taskMode === "fallback") || (R.UPPER.includes(m.direction) && ctx.wallMode === "fallback");
  if(v && v.uncited && loud) out.push(`<span class="chip unc">sem citação da sala</span>`);
  if(v && !v.ok) out.push(`<span class="chip unc">${esc(R.msgPt(v.errors[0]))}</span>`);
  return out.join("");
}
/* Direction follows the slider: below today offers reduzir, above offers
   elevar. Where today is unknown, both are offered. Criar is not here: a new
   axis is created below the seven (change request 4). */
function openSheet(axisId, value){
  const a = ST.axes.find(x => x.id === axisId), base = axisBase(a), old = CURVE.moves[axisId];
  const dirs = base == null ? R.DIRECTIONS.slice() : value < base ? R.LOWER.slice() : R.UPPER.slice();
  SHEET = { axis_id: axisId, to_value: value, dirs,
            direction: old && dirs.includes(old.direction) ? old.direction : (dirs.length === 1 ? dirs[0] : null),
            cites_task_ids: old ? (old.cites_task_ids || []).slice() : [], cites_wall_ids: old ? (old.cites_wall_ids || []).slice() : [],
            offer_only: old ? !!old.offer_only : false, offer_reason: old ? old.offer_reason || "" : "", note: old ? old.note || "" : "" };
}
function placeLine(t){
  if(!t.place) return "a triagem da sala ainda não decidiu";
  if(t.modes && t.modes.length > 1) return "empate: " + t.modes.map(z => R.ZONE_PT[z]).join(" e ");
  return `${t.counts[t.place]} de ${t.counts.n} em ${R.ZONE_PT[t.place]}`;
}
function sheetHTML(ctx){

  const pickW = w => `<button class="pick ${s.cites_wall_ids.includes(w.id) ? "on" : ""}" data-act="citew" data-id="${esc(w.id)}"><span>${esc(w.name)}</span>
    <small>${w.ligado ? "ligado a nós" + (w.arrow ? " · " + R.WALL_ARROW_PT[w.arrow] : "") : "genérico ou alugado"}${w.n ? ` · ${w.n} ${w.n === 1 ? "mesa" : "mesas"}` : ""}${w.generic ? " · lista genérica" : ""}</small></button>`;
  let body = "";
  if(lower){

        : R.axisUntagged(ctx.tasks, a.code) ? `<div class="note">${esc(R.msgPt("lower_untagged_axis"))}</div>`
        : `<div class="note">A sala não pôs debaixo de água nem na linha nenhuma tarefa que produza este eixo: guardou-as todas. Baixá-lo é uma decisão de oferta: marque «só oferta» e diga porquê.</div>`;
      if(others.length) body += `<div class="small muted" style="margin-top:6px">Não servem para baixar, pela triagem da sala: ${others.map(t => `${esc(t.short_pt)} (${esc(placeLine(t))})`).join("; ")}.</div>`;
    }
    body += `<label class="row small" style="margin-top:12px;flex-wrap:nowrap"><input type="checkbox" data-f="offer_only" ${s.offer_only ? "checked" : ""} style="width:auto"> só oferta: uma decisão de oferta, não de automação</label>`;
    if(s.offer_only) body += `<input data-f="offer_reason" maxlength="${R.LIMITS.REASON_MAX}" placeholder="porquê, numa linha" value="${esc(s.offer_reason)}" style="margin-top:6px">`;
  }
  if(upper){
    body += `<div class="kick" style="margin-top:14px">O cartão do muro que a sustenta <span class="muted">the wall card behind it</span></div>`;
    if(ctx.wallMode === "fallback") body += `<div class="note warn">A sala ainda não tem muro: lista genérica.</div>`;
    body += ctx.wall.map(pickW).join("");
    if(s.direction === "raise"){
      const tagged = ctx.tasks.filter(t => (t.axis_tags || []).includes(a.code));
      if(tagged.length) body += `<div class="kick" style="margin-top:14px">E uma tarefa, se a mesma jogada também reduz o toque humano <span class="muted">optional</span></div>` + tagged.map(pickT).join("");
    }
    if(v && v.amber) body += `<div class="note warn" style="margin-top:8px">${esc(R.msgPt("amber"))}</div>`;
  }

  return `<div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-label="${esc(a.label_pt)}"><div class="inner">
    <div class="row" style="justify-content:space-between"><b class="serif" style="font-size:21px">${esc(a.label_pt)}: ${esc(scaleWord(axisBase(a)))} → ${esc(R.SCALE_PT[s.to_value])}</b><button class="link" data-act="closesheet">fechar</button></div>
    ${paceLine(a, ctx)}
    <div class="row" style="margin-top:10px">${s.dirs.map(d => `<button class="${s.direction === d ? "on" : ""}" data-act="dir" data-d="${d}">${R.DIR_PT[d]}</button>`).join("")}</div>

    ${s.direction ? `<textarea data-f="note" maxlength="${R.LIMITS.NOTE_MAX}" rows="2" placeholder="nota, opcional, 140 caracteres" style="margin-top:12px">${esc(s.note)}</textarea>` : ""}
    ${errs.length ? `<div class="small" style="color:var(--bad);margin-top:8px">${esc(R.msgPt(errs[0]))}</div>` : ""}
    <div style="margin-top:12px"><button class="primary" data-act="sheetsave" ${v && v.ok ? "" : "disabled"}>Guardar o movimento</button></div>
  </div></div>`;
}

/* ---------------------------------------------------------------- the chart */
function curveSVG(axes, lines, o){
  o = o || {};
  /* created axes sit to the right, off the scale, as named stubs; the chart grows to hold them */
  const nC = (o.created || []).length, cw = o.big ? 190 : 92;
  const big = !!o.big, W0 = big ? 1500 : 700, W = W0 + nC * cw, L = big ? 190 : 86, Rr = W0 - (big ? 180 : 28), T = 20;
  /* room under the axis names for the two umbrellas, the employer's and the beneficiary's */
  const under = o.sides ? (big ? 96 : 56) : 0;
  const H = (big ? 560 : 300) + under, B = H - (big ? 60 : 40) - under;
  const fs = big ? 22 : 12;
  const x = i => L + i * (Rr - L) / Math.max(1, axes.length - 1);
  const y = v => B - (v / VMAX) * (B - T);
  let g = o.bg ? `<rect x="0" y="0" width="${W}" height="${H}" fill="#193C3F"/>` : "";
  for(let v = 0; v <= VMAX; v++) g += `<line x1="${L}" x2="${Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#2C5457"/><text x="${L - (big ? 22 : 12)}" y="${y(v) + fs / 3}" fill="#9FB4B0" font-size="${fs}" text-anchor="end">${R.SCALE_PT[v]}</text>`;
  axes.forEach((a, i) => {
    g += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${B}" stroke="#2C5457"/>`;
    g += `<text x="${x(i)}" y="${B + fs + 12}" fill="#F4F0E9" font-size="${fs}" font-family="Georgia,serif" text-anchor="${i === 0 ? "start" : i === axes.length - 1 ? "end" : "middle"}">${esc(short(a))}</text>`;
  });
  /* The seam between the two buyers, and an umbrella under each group of axis
     names, in the deck's words (slide 7): the employer buys the plan, the
     beneficiary chooses the dentist. */
  if(o.sides){
    const k = axes.findIndex(a => sideOf(a) === "beneficiary");
    if(k > 0){
      const mx = (x(k - 1) + x(k)) / 2, gap = big ? 18 : 10, tick = big ? 10 : 6;
      const by = B + fs + (big ? 34 : 22);
      g += `<line x1="${mx}" x2="${mx}" y1="${T}" y2="${B}" stroke="#C6A553" stroke-opacity=".45" stroke-dasharray="3 5"/>`;
      const umbrella = (x1, x2, name, sub) =>
        `<path d="M${x1} ${by - tick} L${x1} ${by} L${x2} ${by} L${x2} ${by - tick}" fill="none" stroke="#C6A553" stroke-width="${big ? 2 : 1.2}"/>` +
        `<text x="${(x1 + x2) / 2}" y="${by + fs + 6}" fill="#C6A553" font-size="${fs}" text-anchor="middle" letter-spacing="1.5">${name}</text>` +
        `<text x="${(x1 + x2) / 2}" y="${by + 2 * fs + 10}" fill="#9FB4B0" font-size="${Math.round(fs * .9)}" text-anchor="middle">${sub}</text>`;
      g += umbrella(x(0) - (big ? 6 : 2), mx - gap, "O EMPREGADOR", "quem compra o plano");
      g += umbrella(mx + gap, x(axes.length - 1) + (big ? 6 : 2), "O BENEFICIÁRIO", "quem escolhe o dentista");
    }
  }
  if(nC){
    const sx = Rr + (big ? 70 : 20), wl = big ? 15 : 12, lh = fs + (big ? 5 : 3);
    g += `<line x1="${sx}" x2="${sx}" y1="${T}" y2="${B}" stroke="#C6A553" stroke-opacity=".35" stroke-dasharray="2 6"/>`;
    g += `<text x="${sx + nC * cw / 2}" y="${T + fs}" fill="#C6A553" font-size="${Math.round(fs * .8)}" text-anchor="middle" letter-spacing="2">EIXOS NOVOS · FORA DA ESCALA</text>`;
    o.created.forEach((c, j) => {
      const cx = sx + cw * (j + .5), top = T + fs * 2, bot = top + (B - T) * .22;
      const words = wrapWords(c.name, wl).slice(0, 4);
      g += `<line x1="${cx}" x2="${cx}" y1="${top}" y2="${bot}" stroke="#C6A553" stroke-width="${big ? 5 : 3}" stroke-linecap="round"/>`;
      words.forEach((ln, k) => { g += `<text x="${cx}" y="${bot + (big ? 32 : 16) + k * lh}" fill="#F4F0E9" font-size="${fs}" font-family="Georgia,serif" text-anchor="middle">${esc(ln)}</text>`; });
      if(c.n) g += `<text x="${cx}" y="${bot + (big ? 32 : 16) + words.length * lh + 4}" fill="#9FB4B0" font-size="${Math.round(fs * .85)}" text-anchor="middle">${c.n} ${c.n === 1 ? "mesa" : "mesas"}</text>`;
    });
  }
  const path = (vals, attrs) => {
    const segs = []; let cur = [];
    vals.forEach((v, i) => { if(v == null){ if(cur.length) segs.push(cur); cur = []; } else cur.push(`${x(i)},${y(v)}`); });
    if(cur.length) segs.push(cur);
    return segs.map(s => s.length > 1 ? `<polyline points="${s.join(" ")}" fill="none" ${attrs}/>` : "").join("");
  };
  if(o.band){
    const up = [], dn = [];
    o.band.forEach((q, i) => { if(q.p75 != null){ up.push(`${x(i)},${y(q.p75)}`); dn.unshift(`${x(i)},${y(q.p25)}`); } });
    if(up.length > 1) g += `<polygon points="${up.concat(dn).join(" ")}" fill="#C6A553" fill-opacity=".2" stroke="none"/>`;
  }
  if(o.asis){
    g += path(axes.map(a => typeof a.as_is_you === "number" ? a.as_is_you : null), `stroke="#EDE3CC" stroke-width="${big ? 4 : 2}" stroke-dasharray="${big ? "12 9" : "6 5"}"`);
    if(o.rival) g += path(axes.map(a => typeof a.as_is_rival === "number" ? a.as_is_rival : null), `stroke="#8FA09E" stroke-width="${big ? 4 : 2}" stroke-dasharray="${big ? "12 9" : "6 5"}"`);
  }
  for(const ln of lines){
    g += path(ln.vals, `stroke="${ln.color}" stroke-width="${ln.w}" stroke-opacity="${ln.op || 1}" stroke-linejoin="round"${ln.dash ? ` stroke-dasharray="${ln.dash}"` : ""}`);
    if(ln.dots) ln.vals.forEach((v, i) => { if(v != null) g += `<circle cx="${x(i)}" cy="${y(v)}" r="${big ? 7 : 4}" fill="${ln.color}"/>`; });
  }
  /* the outside read: copper squares, direction only, never the ghost */
  for(const d of (o.outside || [])) g += `<rect x="${x(d.i) - (big ? 11 : 6)}" y="${y(d.v) - (big ? 11 : 6)}" width="${big ? 22 : 12}" height="${big ? 22 : 12}" fill="#B87333"/>`;
  for(const d of (o.amber || [])) g += `<circle cx="${x(d.i) + (big ? 14 : 7)}" cy="${y(d.v)}" r="${big ? 8 : 4}" fill="#E0A040"/>`;
  for(const lb of (o.labels || [])) g += `<text x="${Rr + 14}" y="${y(lb.v) + fs / 3}" fill="${lb.color}" font-size="${fs}" font-family="Georgia,serif">${esc(lb.text)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="a curva de valor">${g}</svg>`;
}

/* ---------------------------------------------------------- the room, derived */
function derive(room){
  const cfg = room.session.config || {};
  const responses = room.sorts.map(x => x.choices);
  const sc = R.sortCounts(room.tasks, responses);
  const sort = R.tallySort(room.tasks, responses);
  /* 15 September: a card every table that sent a sort put on sem acordo was not sorted at all
     (the tables sorted twelve of sixteen); it stays off the tide, its waterline, bands and counts */
  const unsorted = room.tasks.filter(t => { const c = sc && sc.counts && sc.counts[t.id]; return !!c && sc.n > 0 && c.sem_acordo === sc.n; });
  const tide = R.tide(room.tasks.filter(t => !unsorted.includes(t)), sc);
  tide.out = unsorted.map(t => t.short_pt || t.label_pt);
  const wall = R.wallGroups(room.wall, cfg.generic || []);
  const ctx = R.citeContext({ tasks: room.tasks, sort: sc, groups: wall.onWall, generic: cfg.generic || [] });
  const sub = room.curves.filter(c => c.submitted_at);
  const subPids = new Set(sub.map(c => c.pid));
  const moves = room.moves.filter(m => subPids.has(m.pid) && m.valid);
  const tById = R.index(room.tasks);
  const name = { task: id => tById[id] ? (tById[id].short_pt || tById[id].label_pt) : "?",
                 wall: id => ctx.wallIndex[id] ? ctx.wallIndex[id].name : "?" };
  const byPid = {}; for(const m of moves) (byPid[m.pid] = byPid[m.pid] || []).push(m);
  /* change request 6: in a room of rivals, a curve starts from its own table's line */
  const tLine = t => (room.table_placements || []).find(p => p.table_no === t);
  const axesOf = c => cfg.placement_scope === "table" ? R.axesAtTable(room.axes, tLine(c.table_no) ? tLine(c.table_no).choices : null) : room.axes;

/* A name over up to three rows, never cut mid-word; the full label on hover. */
function wrapWords(s, max){
  const out = []; let cur = "";
  for(const w of String(s || "").split(/\s+/).filter(Boolean)){
    const t = cur ? cur + " " + w : w;
    if(!cur || t.length <= max) cur = t; else { out.push(cur); cur = w; }

/* Unimed's figure, carried over: every task a column, its height how far the
   machine still has to go; the water rises to the room's median reach; what the
   room kept in the pôlder stands dry inside copper dikes. A thin cap on each
   column is the place most of the room gave it, the place the citations use. */
function terrainSVG(T, o){
  o = o || {};
  const W = 1000, H = 570, M = 40, TOP = 58, BASE = 372, SPAN = BASE - TOP;
  const RG = 104, rows = T.rows, n = rows.length || 1, gap = 9, cw = (W - 2 * M - RG - (n - 1) * gap) / n;
  const has = T.waterline != null, wy = has ? BASE - T.waterline * SPAN : BASE;
  let g = o.bg ? `<rect x="0" y="0" width="${W}" height="${H}" fill="#193C3F"/>` : "";
  g += `<text x="${M}" y="${TOP - 30}" fill="#9FB4B0" font-size="12" letter-spacing="2.2">ROCHA FIRME · ONDE NENHUMA MÁQUINA CHEGA</text>`;
  g += `<text x="${W - M}" y="${TOP - 30}" fill="#9FB4B0" font-size="12" letter-spacing="2.2" text-anchor="end">AS TAREFAS, DA MAIS INUNDADA À MAIS FIRME →</text>`;
  g += `<text transform="translate(18,${TOP + SPAN / 2}) rotate(-90)" fill="#6E8A86" font-size="11" letter-spacing="2" text-anchor="middle">↑ QUANTO FALTA À MÁQUINA</text>`;
  let cols = "", pol = "", labs = "", marks = "";
  rows.forEach((r, i) => {
    const x = M + i * (cw + gap);
    if(r.reach == null){
      cols += `<rect x="${x.toFixed(1)}" y="${TOP}" width="${cw.toFixed(1)}" height="${SPAN}" fill="none" stroke="#5E7679" stroke-width="1.5" stroke-dasharray="4 5"/>`;
    } else {

             + [x - 4, x + cw + 1].map(dx => `<rect x="${dx.toFixed(1)}" y="${top.toFixed(1)}" width="3" height="${(BASE - top).toFixed(1)}" fill="#BE7B4F"/>`).join("");

       + `<text x="${lx}" y="${((gy(1 / 2) + gy(1)) / 2 + 4).toFixed(1)}" fill="#C6A553" font-size="11.5" letter-spacing="1.4">RESISTE</text>`;
    g += `<line x1="${M - 10}" x2="${W - M + 10}" y1="${o.animate ? BASE : wy.toFixed(1)}" y2="${o.animate ? BASE : wy.toFixed(1)}" stroke="#67A5AB" stroke-width="2.5">${A("y1", BASE, wy.toFixed(1))}${A("y2", BASE, wy.toFixed(1))}</line>`;
    g += `<text x="${M + 10}" y="${(wy - 9).toFixed(1)}" fill="#F4F0E9" font-size="12" letter-spacing="1.8"${o.animate ? ' opacity="0"' : ""}>LINHA D'ÁGUA · HOJE${o.animate ? '<animate attributeName="opacity" from="0" to="1" begin="2.6s" dur=".5s" fill="freeze"/>' : ""}</text>`;
    g += `<text x="${M + 10}" y="${BASE - 9}" fill="#0F2A2C" font-size="12" letter-spacing="2.2" opacity=".75">SUBMERSO</text>`;
  } else {
    g += pol + `<text x="${W / 2}" y="${TOP + SPAN / 2}" fill="#9FB4B0" font-size="16" text-anchor="middle" font-family="Georgia,serif">a triagem ainda não tem respostas</text>`;
  }
  g += labs;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="a maré e as tarefas">${g}</svg>`;

/* The band thresholds in words, for however many tables sent: R.bandOf's
   shares (5/6 and 1/2) turned back into counts. Six tables: 5 a 6, 3 a 4,
   2 ou menos; four: 4 de 4, 2 a 3, 1 ou menos. */
function bandRanges(N){
  const s = Math.ceil(5 * N / 6), c = Math.ceil(N / 2);
  const span = (a, b) => a === b ? `${a}` : `${a} a ${b}`;
  return { settled: `${span(s, N)} de ${N} mesas`, contested: c <= s - 1 ? span(c, s - 1) : "nenhuma", held: c - 1 <= 0 ? "0" : `${c - 1} ou menos` };
}
function placeCounts(D){
  const c = { settled: 0, contested: 0, held: 0 }; let sa = 0;
  D.tide.rows.forEach(r => { if(r.band) c[r.band]++; if(r.counts && r.counts.sem_acordo) sa++; });
  const b = bandRanges(D.tide.n || R.LIMITS.TABLES);
  return `<b>${c.settled}</b> assentes (${b.settled}) · <b>${c.contested}</b> em disputa (${b.contested}) · <b>${c.held}</b> resistem (${b.held})`
    + (sa ? ` · <span style="color:var(--amber)">≠</span> <b>${sa}</b> ${sa === 1 ? "cartão" : "cartões"} com mesas sem acordo` : "")
    + (D.tide.out && D.tide.out.length ? ` · ${D.tide.out.length} ${D.tide.out.length === 1 ? "cartão ficou fora da maré: nenhuma mesa o triou" : "cartões ficaram fora da maré: nenhuma mesa os triou"}` : "")
    + `<span class="small" style="display:block;margin-top:4px">a máquina consegue = mesas que o puseram debaixo de água ou no pôlder · a cor no topo é o lugar que a maioria lhe deu</span>`;
}
function telaSort(room, D){

    <p class="lede" style="margin-top:4px">${placeCounts(D)}</p>`;
}
function telaWall(room, D){

          <span style="display:inline-block;width:13px;height:13px;border:2px solid var(--gold);vertical-align:-1px"></span> genérico ou alugado · ↑ mais escasso · → estável · ↓ mais abundante</p>
        ${off.length ? `<p class="muted" style="font-size:16px;margin-top:10px">abaixo da maioria, fora do muro: ${off.map(g => esc(g.name)).join(" · ")}</p>` : ""}
        <p style="font-size:24px;margin-top:16px"><b class="serif" style="color:${D.wall.scarceCount ? "var(--gold)" : "var(--bad)"}">${D.wall.scarceCount}</b> ${D.wall.scarceCount === 1 ? "nosso e mais escasso" : "nossos e mais escassos"}: só esses sustentam uma elevação sem aviso.</p></div></div>`;

/* Change request 6: one line per table, each in its own colour, named by its rival */

/* ----------------------------------------------------------------- export */
function csvCell(v){ const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
/* Both rooms run the same instrument: the columns join on task and axis

function exportCSV(){

                "cites_tasks", "cites_task_places", "cites_wall", "cites_wall_ligado", "cites_wall_arrow", "offer_only", "offer_reason", "note", "uncited", "amber", "valid"];
  const rows = ROOM.moves.map(m => {
    const a = axById[m.axis_id], c = curveBy[m.pid] || {};
    const ts = (m.cites_task_ids || []).map(id => tById[id]), ws = (m.cites_wall_ids || []).map(id => D.ctx.wallIndex[id]);
    return [s.id, s.title, s.cohort, D.respondent[m.pid], a ? sideOf(a) : "", c.submitted_at ? 1 : 0, a ? a.code : m.axis_id, m.direction, m.to_value,
            a && a.as_is_you, a ? scaleWord(a.as_is_you) : "", ts.map(t => t ? t.code : "?").join(" "), ts.map(t => t && ctxT[t.id] ? ctxT[t.id].place || "" : "").join(" "),
            ws.map(w => w ? w.name : "?").join(" | "), ws.map(w => w ? (w.ligado ? 1 : 0) : "").join(" "), ws.map(w => w && w.arrow ? w.arrow : "").join(" "),
            m.offer_only ? 1 : 0, m.offer_reason, m.note, m.uncited ? 1 : 0, m.amber ? 1 : 0, m.valid ? 1 : 0];
  });
  download(`nova-curva_${s.id}.csv`, [head, ...rows].map(r => r.map(csvCell).join(",")).join("\n"), "text/csv;charset=utf-8");

/* Change request 4: the created axes, one row per table's axis, never inside

function createdExport(){

/* Change request 5: one commitment object per table: its option, its fields
   in words, its citations as ids, owner and date, and the sentence. */
function commitExport(c, n){
  const bill = c.bill ? (c.bill.kind === "card" ? n.task(c.bill.id) : c.bill.kind === "reduce" ? "baixar " + n.axis(c.bill.id) : c.bill.text) : null;
  return { table_no: c.table_no, option: c.option,
    polder: c.polder ? (c.polder.kind === "created" ? n.created(c.polder.id) : n.task(c.polder.id)) : null, bill, know: c.know || null,
    raise_axis: c.raise ? n.axis(c.raise.axis_id) : null, buyer_sees: c.raise ? c.raise.sees : null, guard: c.guard ? n.wall(c.guard) : null, price: c.price || null,
    owner: c.owner, review: c.review, amber: !!c.amber, uncited: !!c.uncited, submitted_at: c.submitted_at,
    citations: { polder: c.polder || null, bill: c.bill || null, raise_axis_id: c.raise ? c.raise.axis_id : null, guard: c.guard || null },
    sentence: R.commitSentence(c, n) };
}
function exportCommitCSV(){

  const rows = D.commits.map(c => commitExport(c, D.name)).map(x => [s.id, s.title, s.cohort, x.table_no, x.option, x.polder, x.bill, x.know, x.raise_axis, x.buyer_sees,

/* The device ids are the phones' keys to their own rows; the export carries
   respondent numbers instead. */
function exportJSON(){
  const D = ROOM.D, rid = p => D.respondent[p] || "r?";
  const out = { session: ROOM.session, tasks: ROOM.tasks, axes: ROOM.axes,
    sorts: ROOM.sorts.map(x => ({ table_no: x.table_no, choices: x.choices, submitted_at: x.submitted_at })),
    wall: ROOM.wall, seats: ROOM.seats.map(x => ({ table_no: x.table_no, claimed_at: x.claimed_at })),
    curves: ROOM.curves.map(c => ({ respondent: rid(c.pid), buyer: c.buyer, submitted_at: c.submitted_at })),

    if(!confirm(`Encher esta sessão com uma sala de ensaio de ${rehPeople(tb)}, em ${tb} mesas? Isto também a abre aos telefones.`)) return;
    BUSY = true; NOTE = "a encher…"; render();
    try { await window.NCREHEARSAL.run({ call: (p, o) => api(p, o || {}), sessionId: SID, tables: tb, people: rehPeople(tb), log: m => { NOTE = m; render(); } }); NOTE = "Sala de ensaio pronta."; }
    catch(e){ NOTE = "O ensaio parou: " + e.message; }
    BUSY = false; await pollSessions(); await refetchRoom();
  },
  async delses(){ if(!confirm("Apagar esta sessão e tudo o que a sala escreveu nela?")) return;
    const ok = await facil(() => api(`/f/session?session_id=${encodeURIComponent(SID)}`, { method: "DELETE", key: true }));
    if(ok){ SID = null; S.del("sid"); ROOM = null; await pollSessions(); render(); } },
};
function onClick(e){
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if(!f) return;
  if(el.tagName === "A") e.preventDefault();
  f(el, e);
}
function refreshSheetButton(){
  const btn = document.querySelector("[data-act=sheetsave]"); if(!btn || !SHEET) return;
  const a = ST.axes.find(x => x.id === SHEET.axis_id);
  const v = SHEET.direction ? R.validateMove({ ...SHEET }, ctxNow(), a) : null;
  btn.disabled = !(v && v.ok);
}
function onInput(e){
  const el = e.target;
  if(el.id === "nstitle"){ NSF.title = el.value; return; }
  if(el.id === "nstables"){ NSF.tables = el.value; return; }
  if(el.dataset.wall != null){ WALL.rows[+el.dataset.wall].name = el.value.slice(0, R.LIMITS.WALL_NAME_MAX); WALL.dirty = true; saveWall(); debounce("wall", 1500, pushWall); return; }
  if(el.dataset.f && SHEET && el.type !== "checkbox"){ SHEET[el.dataset.f] = el.value; refreshSheetButton(); return; }
  if(el.dataset.axname != null && AXN.form){ AXN.form.name = el.value.slice(0, R.LIMITS.AXIS_NAME_MAX); refreshAxButton(); return; }
  if(el.dataset.pr != null && PLACE){
    PLACE.rival = el.value.slice(0, 60); savePlace();
    const b = document.querySelector("[data-act=placesubmit]");
    if(b) b.disabled = !(ST.axes.every(a => PLACE.choices[a.code]) && PLACE.rival.trim());
    const h = document.querySelector("[data-prmiss]"); if(h) h.textContent = placeMissing();
    return;
  }
  if(el.dataset.cf && COMMIT){
    const k = el.dataset.cf, v = el.value;
    if(k === "sees") COMMIT.raise.sees = v;
    else if(k === "billtext"){ if(v.trim()) COMMIT.bill = { kind: "text", text: v }; else if(COMMIT.bill && COMMIT.bill.kind === "text") COMMIT.bill = null; }
    else COMMIT[k] = v;
    COMMIT.err = null; saveCommit(); return;
  }
}
/* the new-session form keeps what was typed and chosen: the console redraws on every poll */
const NSF = { title: "", seed: "session.json", cohort: "emergente", tables: null, reh: false };
function onChange(e){
  const el = e.target;
  /* the seed sets the likely room: the morning's three tables, the afternoon's eight */
  if(el.id === "nsseed"){ const oc = el.value !== "session.json";
    NSF.seed = el.value; NSF.tables = oc ? 3 : 8; NSF.cohort = oc ? "senior" : "emergente";
    const t = document.getElementById("nstables"), c = document.getElementById("nscohort");
    if(t) t.value = NSF.tables; if(c) c.value = NSF.cohort; return; }
  if(el.id === "nscohort"){ NSF.cohort = el.value; return; }
  if(el.id === "nstables"){ NSF.tables = el.value; return; }
  if(el.id === "nsreh"){ NSF.reh = el.checked; return; }
  if(el.type === "range" && el.dataset.ax){
    const v = Number(el.value), a = ST.axes.find(x => x.id === el.dataset.ax), base = axisBase(a);
    if(base != null && v === base){
      if(CURVE.moves[a.id]){ delete CURVE.moves[a.id]; CURVE.submitted = false; CURVE.dirty = true; saveCurve(); debounce("curve", 800, () => pushCurve(false)); }
      render(); return;
    }
    openSheet(a.id, v); render(); return;
  }
  if(el.dataset.f === "offer_only" && SHEET){ SHEET.offer_only = el.checked; render(); }
}

function render(){
  const r = route();
  const V = !RELATOR && (r === "triagem" || r === "porta-voz" || r === "compromisso") ? viewRelatorOnly
    : { "": RELATOR ? viewRelator : viewDoor, triagem: viewTriagem, curva: viewCurva, "porta-voz": viewPortaVoz, compromisso: viewCompromisso,
        f: viewConsole, tela: viewTela, relatorio: viewRelatorio }[r] || viewDoor;
  const y = window.scrollY;
  document.getElementById("app").innerHTML = V();
  if(r !== "triagem") window.scrollTo(0, y);
}
</script>
<script>boot();</script>
