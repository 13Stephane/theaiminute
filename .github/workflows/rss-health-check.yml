name: RSS feed health check

# Periodically verifies that the theaiminute.blog RSS feed is reachable, valid,
# and fresh. If the check fails, the job exits non-zero (so GitHub's built-in
# notifications fire) and — when SMTP secrets are configured — a detailed alert
# email is sent. See .github/workflows/README.md for setup.

on:
  schedule:
    # Every 4 hours, aligned with the ingestion pipeline cadence.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rss-health-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Exposed so the "Email on failure" step can skip itself when SMTP is
      # not configured, letting GitHub's native failure notification take over.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check RSS feed health
        id: check
        env:
          FEED_URL: ${{ vars.RSS_FEED_URL || 'https://theaiminute.blog/rss.xml' }}
          MAX_AGE_HOURS: ${{ vars.RSS_MAX_AGE_HOURS || '48' }}
        run: |
          set +e
          report="$(python .github/scripts/check_rss.py)"
          code=$?
          set -e
          echo "$report"
          {
            echo "report<<RSS_REPORT_EOF"
            echo "$report"
            echo "RSS_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$report" >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Email on failure
        if: ${{ failure() && env.MAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: The AI Minute Monitor <${{ secrets.MAIL_USERNAME }}>
          to: ${{ vars.ALERT_EMAIL || secrets.MAIL_USERNAME }}
          subject: "⚠️ theaiminute.blog RSS feed check failed"
          body: |
            The scheduled RSS health check failed.

            ${{ steps.check.outputs.report }}

            Workflow run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
